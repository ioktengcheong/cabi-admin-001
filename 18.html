<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>自助柜条码及收货单</title>
<script src="https://unpkg.com/@zxing/library@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --ink:#0f172a; --sub:#334155; --cyan:#0284c7; --bg:#f8fafc;
    --muted:#64748b; --ok:#059669; --bad:#dc2626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:rgba(2,132,199,.2);}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    font-size:20px;line-height:1.45;font-weight:700;
  }
  .app{max-width:640px;margin:0 auto;padding:16px;padding-bottom:60px;}

  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
  .head h1{font-size:28px;margin:0;font-weight:900;}
  .badge{
    background:#dbeafe;color:#002d72;border:3px solid #0047ab;border-radius:14px;
    padding:8px 16px;font-size:20px;font-weight:900;white-space:nowrap;
  }

  .status-banner{
    padding:14px 18px;border-radius:14px;font-size:19px;font-weight:900;
    margin-bottom:14px;background:#fef3c7;color:#78350f;border:3px solid #d97706;display:none;
  }
  .status-banner.show{display:block;}

  .card{border:3px solid #cbd5e1;border-radius:20px;padding:18px;margin-bottom:16px;background:#fff;}
  .card-title{
    font-size:22px;font-weight:900;color:var(--cyan);margin:0 0 12px;
    display:flex;align-items:center;gap:10px;
  }
  .card-title .num{
    background:var(--cyan);color:#fff;border-radius:50%;width:32px;height:32px;
    display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 32px;
  }

  .row{display:flex;gap:10px;margin-top:12px;}
  .row:first-of-type{margin-top:0;}
  .row input{
    flex:1;min-width:0;font-size:22px;font-weight:900;padding:16px;
    border:3px solid var(--ink);border-radius:14px;background:#fff;
  }
  .row input:focus{outline:2px solid var(--cyan);}

  .btn{
    border:3px solid transparent;border-radius:16px;padding:16px 18px;font-size:20px;font-weight:900;
    cursor:pointer;color:#fff;display:inline-flex;align-items:center;justify-content:center;
    gap:8px;min-height:60px;
  }
  .btn:active{transform:scale(.97);}
  .btn:disabled{background:#e2e8f0!important;color:#94a3b8!important;border-color:#cbd5e1!important;cursor:not-allowed;}
  .btn-blue{background:var(--cyan);border-color:#075985;}
  .btn-green{background:var(--ok);border-color:#065f46;}
  .btn-gray{background:#475569;border-color:#1e293b;}
  .btn-red{background:var(--bad);border-color:#7f1d1d;}
  .btn-full{width:100%;}
  .btn-small{min-height:48px;padding:10px 14px;font-size:17px;}

  .hint{font-size:16px;color:var(--muted);line-height:1.5;margin-top:8px;}

  .photo-preview{margin-top:14px;text-align:center;display:none;}
  .photo-preview.show{display:block;}
  .photo-preview img{max-width:100%;max-height:320px;border:3px solid var(--ink);border-radius:14px;}
  .photo-preview .remove-btn{margin-top:10px;}

  .record-item{border:3px solid #cbd5e1;border-radius:16px;padding:14px;margin-bottom:12px;background:#f8fafc;}
  .record-main{font-size:20px;font-weight:900;margin-bottom:4px;word-break:break-all;}
  .record-sub{font-size:16px;color:var(--sub);margin-bottom:10px;font-weight:700;}
  .record-thumb{
    max-width:100%;max-height:180px;border-radius:10px;border:2px solid #cbd5e1;
    margin-bottom:10px;cursor:pointer;display:block;
  }
  .record-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .hidden{display:none!important;}

  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;
    padding:20px;display:flex;align-items:center;justify-content:center;
  }
  .scanbox{width:min(100%,520px);background:#fff;border-radius:24px;padding:20px;}
  .video-wrapper{
    position:relative;width:100%;height:320px;border-radius:16px;overflow:hidden;background:#000;
  }
  .video-wrapper video{width:100%;height:100%;object-fit:cover;display:block;}
  .scan-reticle{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:72%;height:90px;border:3px solid #38bdf8;border-radius:12px;
    box-shadow:0 0 0 9999px rgba(0,0,0,.52);pointer-events:none;z-index:2;
  }
  .scan-laser{
    position:absolute;top:50%;left:6%;right:6%;height:2px;
    background:#ef4444;box-shadow:0 0 8px #ef4444;animation:laserScan 1.6s infinite ease-in-out;
  }
  @keyframes laserScan{
    0%,100%{transform:translateY(-28px);}
    50%{transform:translateY(28px);}
  }
  .engine-badge{
    display:inline-block;font-size:14px;font-weight:800;padding:4px 10px;
    border-radius:6px;background:#e0f2fe;color:#0369a1;margin-bottom:8px;
  }
  .scanbox h3{font-size:22px;margin:4px 0 12px;text-align:center;}
  .scanbox .hint{text-align:center;margin-top:10px;color:#0f172a;font-weight:bold;}

  .success{
    position:fixed;left:20px;right:20px;bottom:24px;max-width:500px;margin:auto;
    background:var(--ok);color:#fff;padding:18px;border-radius:18px;
    font-weight:900;font-size:20px;z-index:30;text-align:center;
    box-shadow:0 10px 15px rgba(0,0,0,.2);
  }

  .image-modal-img{max-width:95%;max-height:85vh;border-radius:16px;}
  .image-modal-tip{color:#fff;margin-top:14px;font-size:18px;font-weight:bold;text-align:center;}

  @media (max-width:480px){
    .head h1{font-size:24px;}
    .card-title{font-size:20px;}
    .row{flex-direction:column;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="head">
    <h1>自助柜条码及收货单</h1>
    <div class="badge" id="savedCountBadge">已存：0 单</div>
  </div>

  <div id="statusBanner" class="status-banner"></div>

  <!-- 1. 扫条码 -->
  <section class="card">
    <h2 class="card-title"><span class="num">1</span>扫条码</h2>
    <div class="row">
      <input type="text" id="barcodeInput" placeholder="扫码或手动输入条码" autocomplete="off">
      <button class="btn btn-blue" onclick="openScanner('barcode')">📷 扫码</button>
    </div>
  </section>

  <!-- 2. 拍照 + PO -->
  <section class="card">
    <h2 class="card-title"><span class="num">2</span>拍收货单 / PO 单号</h2>
    <div class="row">
      <input type="text" id="poInput" placeholder="输入收货单号 / PO（可不填）" autocomplete="off">
    </div>
    <div class="row">
      <button class="btn btn-blue btn-full" onclick="openProofCamera()">📸 拍收货单照片</button>
    </div>
    <div id="photoPreview" class="photo-preview">
      <img id="photoPreviewImg" alt="收货单照片">
      <div class="remove-btn">
        <button class="btn btn-gray btn-small" onclick="removePhoto()">✕ 重拍 / 移除</button>
      </div>
    </div>
  </section>

  <!-- 3. 保存 -->
  <section class="card">
    <button class="btn btn-green btn-full" onclick="saveRecord()" style="font-size:24px;min-height:68px;">✅ 保存此单</button>
  </section>

  <!-- 4. 记录 + 汇出 -->
  <section class="card">
    <h2 class="card-title"><span class="num">3</span>已完成记录</h2>
    <div id="storageInfo" class="hint" style="margin-bottom:10px;"></div>
    <div class="row">
      <button class="btn btn-green btn-full" onclick="exportCsv()">📄 汇出 CSV</button>
    </div>
    <div class="row">
      <button class="btn btn-blue btn-full" onclick="exportZip()">📦 汇出 ZIP（含照片）</button>
    </div>
    <div class="row">
      <button class="btn btn-red btn-full" onclick="clearAllRecords()">🗑️ 清空全部记录</button>
    </div>
    <div id="recordsList" style="margin-top:16px;"></div>
  </section>
</div>

<!-- 扫描 overlay -->
<div id="scanner" class="overlay hidden">
  <div class="scanbox" style="text-align:center;">
    <span id="engineBadge" class="engine-badge">⚡ 侦测引擎初始化...</span>
    <h3 id="scanTitle">对准条码进行扫描</h3>
    <div class="video-wrapper">
      <video id="video" autoplay muted playsinline></video>
      <div class="scan-reticle">
        <div class="scan-laser"></div>
      </div>
    </div>
    <p class="hint">请将【单一目标条码】放入蓝色框内</p>
    <button class="btn btn-gray btn-full" style="margin-top:12px;" onclick="closeScanner()">关闭相机</button>
  </div>
</div>

<!-- 拍照 overlay -->
<div id="proofCamera" class="overlay hidden">
  <div class="scanbox">
    <h3>即时拍摄收货单</h3>
    <video id="proofVideo" autoplay muted playsinline
           style="width:100%;height:300px;object-fit:cover;border-radius:16px;background:#000;"></video>
    <canvas id="proofCanvas" class="hidden"></canvas>
    <div class="row" style="margin-top:16px;">
      <button class="btn btn-gray" style="flex:1;" onclick="closeProofCamera()">取消</button>
      <button class="btn btn-green" style="flex:2;" onclick="takeProofPhoto()">📸 拍照</button>
    </div>
  </div>
</div>

<!-- 图片放大 -->
<div id="imageModal" class="overlay hidden" onclick="closeImageModal()">
  <div style="text-align:center;">
    <img id="modalImg" class="image-modal-img" src="" alt="">
    <p class="image-modal-tip">点击任意处关闭</p>
  </div>
</div>

<div id="success" class="success hidden">🎉 已保存！</div>

<script>
/* ==========================================================
   存储层：IndexedDB + Blob
   ========================================================== */
const DB_NAME = 'self_cabinet_grn_db';
const DB_VERSION = 1;
const STORE = 'records';
const LEGACY_KEY = 'self_cabinet_grn_v2'; // 旧版 localStorage key，用于一次性迁移

let db = null;
let records = [];              // 内存缓存，倒序（最新在前）
let thumbURLs = new Map();     // id -> objectURL，避免重复创建

let currentPhotoBlob = null;   // 当前待保存照片
let currentPhotoURL = null;    // 当前预览 objectURL
let modalURL = null;           // 图片放大 objectURL

/* ---------- 打开数据库 ---------- */
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) {
        d.createObjectStore(STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbGetAll() {
  return new Promise((resolve, reject) => {
    if (!db) return reject(new Error('DB 未就绪'));
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

function dbPut(rec) {
  return new Promise((resolve, reject) => {
    if (!db) return reject(new Error('DB 未就绪'));
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(rec);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function dbDelete(id) {
  return new Promise((resolve, reject) => {
    if (!db) return reject(new Error('DB 未就绪'));
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function dbClear() {
  return new Promise((resolve, reject) => {
    if (!db) return reject(new Error('DB 未就绪'));
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ---------- 旧 localStorage 数据迁移（一次性） ---------- */
function dataURLtoBlob(dataurl) {
  try {
    const arr = dataurl.split(',');
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8 = new Uint8Array(n);
    while (n--) u8[n] = bstr.charCodeAt(n);
    return new Blob([u8], { type: mime });
  } catch (e) { return null; }
}

async function migrateLegacy() {
  try {
    const raw = localStorage.getItem(LEGACY_KEY);
    if (!raw) return;
    const old = JSON.parse(raw);
    if (!Array.isArray(old) || !old.length) {
      localStorage.removeItem(LEGACY_KEY);
      return;
    }
    for (const r of old) {
      const blob = r.photo ? dataURLtoBlob(r.photo) : null;
      const rec = {
        id: r.id || ('R' + Date.now() + Math.random().toString(36).slice(2, 6)),
        barcode: r.barcode || '',
        poNo: r.poNo || '',
        time: r.time || '',
        createdAt: Number(String(r.id || '').replace('R', '')) || Date.now(),
        photoBlob: blob
      };
      await dbPut(rec);
    }
    localStorage.removeItem(LEGACY_KEY);
    console.log('已迁移旧记录', old.length);
  } catch (e) {
    console.warn('迁移失败', e);
  }
}

/* ==========================================================
   扫描器（24.html 双引擎方案）
   ========================================================== */
let scanTarget = null;
let codeReader = null;
let isProcessingScan = false;
let nativeScanLoopId = null;
let activeScanStream = null;
let proofStream = null;

const REQUIRED_BARCODE_FORMATS = ['code_128','code_39','ean_13','qr_code','codabar','itf'];
const MAX_NATIVE_DETECT_ERRORS = 3;

function checkCameraEnvironment() {
  if (!window.isSecureContext) {
    showMsg('此功能必须 HTTPS 连线', 'bad'); return false;
  }
  if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
    showMsg('此浏览器不支援相机，请用 Chrome / Safari', 'bad'); return false;
  }
  return true;
}

async function acquireCameraStreamWithFallback(options = {}) {
  const w1 = options.preferredWidth || 1280;
  const h1 = options.preferredHeight || 720;
  const w2 = options.fallbackWidth || 640;
  const h2 = options.fallbackHeight || 480;
  const candidates = [
    { video: { facingMode: { ideal: 'environment' }, width: { ideal: w1 }, height: { ideal: h1 } }, audio: false },
    { video: { facingMode: { ideal: 'environment' }, width: { ideal: w2 }, height: { ideal: h2 } }, audio: false },
    { video: { facingMode: 'environment' }, audio: false },
    { video: true, audio: false }
  ];
  let lastError = null;
  for (const c of candidates) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia(c);
      if (stream) return stream;
    } catch (err) { lastError = err; }
  }
  throw lastError || new Error('所有相机模式皆无法启动');
}

function setScannerBadge(mode) {
  const badge = document.getElementById('engineBadge');
  if (!badge) return;
  if (mode === 'native') {
    badge.textContent = '⚡ 高速扫描模式';
    badge.style.background = '#dcfce7'; badge.style.color = '#166534';
  } else {
    badge.textContent = '🔄 相容扫描模式';
    badge.style.background = '#e0f2fe'; badge.style.color = '#0369a1';
  }
}

async function getSupportedNativeFormats() {
  if (typeof window.BarcodeDetector === 'undefined') return [];
  if (typeof window.BarcodeDetector.getSupportedFormats !== 'function') {
    return REQUIRED_BARCODE_FORMATS;
  }
  try {
    const supported = await window.BarcodeDetector.getSupportedFormats();
    if (!Array.isArray(supported) || supported.length === 0) return [];
    const set = new Set(supported.map(f => String(f).toLowerCase()));
    return REQUIRED_BARCODE_FORMATS.filter(f => set.has(f.toLowerCase()));
  } catch (e) { return []; }
}

function startZxingOnExistingVideo(videoEl) {
  if (isProcessingScan) return;
  setScannerBadge('zxing');
  if (nativeScanLoopId) { clearTimeout(nativeScanLoopId); nativeScanLoopId = null; }
  try {
    if (!codeReader) codeReader = new ZXing.BrowserMultiFormatReader();
    else if (typeof codeReader.reset === 'function') codeReader.reset();

    codeReader.decodeFromVideoElementContinuously(videoEl, (result, err) => {
      if (isProcessingScan) return;
      if (result && result.text) handleScanSuccess(result.text);
    });
  } catch (e) { console.warn('ZXing 启动失败', e); }
}

async function openScanner(target) {
  if (!checkCameraEnvironment()) return;
  stopActiveCamera({ hideOverlay: false });

  scanTarget = target;
  document.getElementById('scanner').classList.remove('hidden');
  isProcessingScan = false;

  const video = document.getElementById('video');
  try {
    const stream = await acquireCameraStreamWithFallback({ preferredWidth: 1280, preferredHeight: 720 });
    activeScanStream = stream;
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    console.error('相机开启失败', e);
    showMsg('无法启动相机，请检查权限', 'bad');
    stopActiveCamera({ hideOverlay: true });
    return;
  }

  const usableFormats = await getSupportedNativeFormats();
  if (usableFormats.length > 0) {
    try {
      const detector = new window.BarcodeDetector({ formats: usableFormats });
      setScannerBadge('native');

      const cropCanvas = document.createElement('canvas');
      const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
      let consecutiveErrors = 0;

      const scanLoop = async () => {
        if (isProcessingScan || !activeScanStream) return;
        if (video.readyState >= video.HAVE_CURRENT_DATA && video.videoWidth > 0 && video.videoHeight > 0) {
          const sw = Math.floor(video.videoWidth * 0.75);
          const sh = Math.floor(video.videoHeight * 0.35);
          const sx = Math.floor((video.videoWidth - sw) / 2);
          const sy = Math.floor((video.videoHeight - sh) / 2);
          cropCanvas.width = sw; cropCanvas.height = sh;
          cropCtx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
          try {
            const barcodes = await detector.detect(cropCanvas);
            consecutiveErrors = 0;
            if (barcodes && barcodes.length > 0 && barcodes[0].rawValue) {
              handleScanSuccess(barcodes[0].rawValue);
              return;
            }
          } catch (detectErr) {
            consecutiveErrors++;
            if (consecutiveErrors >= MAX_NATIVE_DETECT_ERRORS) {
              startZxingOnExistingVideo(video);
              return;
            }
          }
        }
        nativeScanLoopId = setTimeout(scanLoop, 80);
      };
      scanLoop();
      return;
    } catch (initErr) {
      console.warn('BarcodeDetector 初始化失败', initErr);
    }
  }
  startZxingOnExistingVideo(video);
}

function handleScanSuccess(text) {
  if (isProcessingScan) return;
  isProcessingScan = true;
  playBeep();
  if (navigator.vibrate) navigator.vibrate(100);

  if (scanTarget === 'barcode') {
    document.getElementById('barcodeInput').value = text;
    showMsg('已扫到：' + text, 'ok');
  }
  stopActiveCamera({ hideOverlay: true });
}

function stopActiveCamera(options = { hideOverlay: true }) {
  isProcessingScan = true;
  if (nativeScanLoopId) { clearTimeout(nativeScanLoopId); nativeScanLoopId = null; }
  if (codeReader) {
    try { codeReader.reset(); } catch (e) {}
    codeReader = null;
  }
  if (activeScanStream) {
    try { activeScanStream.getTracks().forEach(t => t.stop()); } catch (e) {}
    activeScanStream = null;
  }
  const video = document.getElementById('video');
  if (video) {
    try { video.pause(); } catch (e) {}
    if (video.srcObject) {
      try { video.srcObject.getTracks().forEach(t => t.stop()); } catch (e) {}
      video.srcObject = null;
    }
  }
  if (options && options.hideOverlay) {
    document.getElementById('scanner').classList.add('hidden');
  }
}

function closeScanner() { stopActiveCamera({ hideOverlay: true }); }

/* ==========================================================
   拍照（canvas -> Blob）
   ========================================================== */
function canvasToBlob(canvas, quality) {
  return new Promise((resolve, reject) => {
    if (canvas.toBlob) {
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob 失败')), 'image/jpeg', quality);
    } else {
      // 极旧浏览器 fallback
      try {
        const dataURL = canvas.toDataURL('image/jpeg', quality);
        resolve(dataURLtoBlob(dataURL));
      } catch (e) { reject(e); }
    }
  });
}

async function openProofCamera() {
  if (!checkCameraEnvironment()) return;
  document.getElementById('proofCamera').classList.remove('hidden');
  try {
    proofStream = await acquireCameraStreamWithFallback({ preferredWidth: 1600, preferredHeight: 1200 });
    const video = document.getElementById('proofVideo');
    video.srcObject = proofStream;
    await video.play();
  } catch (e) {
    alert('无法开启相机，请检查浏览器相机权限');
    closeProofCamera();
  }
}

async function takeProofPhoto() {
  const video = document.getElementById('proofVideo');
  const canvas = document.getElementById('proofCanvas');
  if (!video.videoWidth) return;

  // 限制最长边 1600px 并压缩，Blob 直接入 IndexedDB
  const maxW = 1600;
  const scale = video.videoWidth > maxW ? maxW / video.videoWidth : 1;
  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  try {
    const blob = await canvasToBlob(canvas, 0.72);
    if (currentPhotoURL) { URL.revokeObjectURL(currentPhotoURL); currentPhotoURL = null; }
    currentPhotoBlob = blob;
    currentPhotoURL = URL.createObjectURL(blob);
    closeProofCamera();
    renderPhotoPreview();
    showMsg('已拍好收货单', 'ok');
  } catch (e) {
    showMsg('照片生成失败：' + e.message, 'bad');
  }
}

function closeProofCamera() {
  const video = document.getElementById('proofVideo');
  if (video && video.srcObject) {
    try { video.srcObject.getTracks().forEach(t => t.stop()); } catch (e) {}
    video.pause();
    video.srcObject = null;
  }
  proofStream = null;
  document.getElementById('proofCamera').classList.add('hidden');
}

function removePhoto() {
  if (currentPhotoURL) { URL.revokeObjectURL(currentPhotoURL); currentPhotoURL = null; }
  currentPhotoBlob = null;
  renderPhotoPreview();
}

function clearCurrentPhoto() {
  if (currentPhotoURL) { URL.revokeObjectURL(currentPhotoURL); currentPhotoURL = null; }
  currentPhotoBlob = null;
  renderPhotoPreview();
}

function renderPhotoPreview() {
  const box = document.getElementById('photoPreview');
  const img = document.getElementById('photoPreviewImg');
  if (currentPhotoURL) {
    img.src = currentPhotoURL;
    box.classList.add('show');
  } else {
    img.removeAttribute('src');
    box.classList.remove('show');
  }
}

/* ==========================================================
   保存
   ========================================================== */
async function saveRecord() {
  const barcode = document.getElementById('barcodeInput').value.trim();
  const poNo = document.getElementById('poInput').value.trim();

  if (!barcode) { showMsg('请先扫条码', 'bad'); return; }
  if (!currentPhotoBlob) { showMsg('请先拍收货单照片', 'bad'); return; }
  if (!db) { showMsg('数据库未就绪，请稍等', 'bad'); return; }

  const now = new Date();
  const timeStr = now.toLocaleString('zh-HK', { hour12: false });

  const rec = {
    id: 'R' + Date.now(),
    barcode: barcode,
    poNo: poNo,
    time: timeStr,
    createdAt: now.getTime(),
    photoBlob: currentPhotoBlob
  };

  try {
    await dbPut(rec);
  } catch (e) {
    showMsg('保存失败：' + (e.message || '未知'), 'bad');
    return;
  }

  records.unshift(rec);

  document.getElementById('barcodeInput').value = '';
  document.getElementById('poInput').value = '';
  clearCurrentPhoto();

  renderBadge();
  renderRecords();
  updateStorage();
  showSuccess();
}

function showSuccess() {
  const el = document.getElementById('success');
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 1800);
}

/* ==========================================================
   渲染
   ========================================================== */
function renderBadge() {
  document.getElementById('savedCountBadge').textContent = '已存：' + records.length + ' 单';
}

function revokeThumbs() {
  thumbURLs.forEach(({ url }) => { try { URL.revokeObjectURL(url); } catch (e) {} });
  thumbURLs.clear();
}

function renderRecords() {
  revokeThumbs();
  const box = document.getElementById('recordsList');

  if (!records.length) {
    box.innerHTML = '<div class="hint" style="text-align:center;padding:20px;">尚未有记录</div>';
    return;
  }

  // 先创建缩略图 URL
  records.forEach(r => {
    if (r.photoBlob) {
      try { thumbURLs.set(r.id, { url: URL.createObjectURL(r.photoBlob) }); } catch (e) {}
    }
  });

  box.innerHTML = records.map((r, i) => {
    const thumb = (r.photoBlob && thumbURLs.has(r.id))
      ? `<img src="${thumbURLs.get(r.id).url}" class="record-thumb" loading="lazy" onclick="showImageModal('${r.id}')" alt="">`
      : '';
    return `
      <div class="record-item">
        <div class="record-main">${i + 1}. 条码：${esc(r.barcode)}</div>
        <div class="record-sub">PO：${esc(r.poNo || '无')} ｜ 时间：${esc(r.time)}</div>
        ${thumb}
        <div class="record-actions">
          <button class="btn btn-blue btn-small" onclick="downloadPhoto('${r.id}')">⬇️ 下载相片</button>
          <button class="btn btn-red btn-small" onclick="deleteRecord('${r.id}')">🗑️ 删除</button>
        </div>
      </div>
    `;
  }).join('');
}

function showImageModal(id) {
  const r = records.find(x => x.id === id);
  if (!r || !r.photoBlob) return;
  if (modalURL) { try { URL.revokeObjectURL(modalURL); } catch (e) {} modalURL = null; }
  modalURL = URL.createObjectURL(r.photoBlob);
  document.getElementById('modalImg').src = modalURL;
  document.getElementById('imageModal').classList.remove('hidden');
}

function closeImageModal() {
  document.getElementById('imageModal').classList.add('hidden');
  if (modalURL) { try { URL.revokeObjectURL(modalURL); } catch (e) {} modalURL = null; }
}

function downloadPhoto(id) {
  const r = records.find(x => x.id === id);
  if (!r || !r.photoBlob) return;
  const url = URL.createObjectURL(r.photoBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (r.barcode || 'grn') + '_' + (r.poNo || 'photo') + '.jpg';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

async function deleteRecord(id) {
  if (!confirm('确定删除此记录？')) return;
  try { await dbDelete(id); } catch (e) { showMsg('删除失败：' + e.message, 'bad'); return; }
  records = records.filter(r => r.id !== id);
  renderBadge();
  renderRecords();
  updateStorage();
  showMsg('已删除', 'ok');
}

async function clearAllRecords() {
  if (!records.length) return;
  if (!confirm(`确定清空全部 ${records.length} 条记录？此操作无法复原`)) return;
  try { await dbClear(); } catch (e) { showMsg('清空失败：' + e.message, 'bad'); return; }
  records = [];
  renderBadge();
  renderRecords();
  updateStorage();
  showMsg('已清空全部记录', 'ok');
}

/* ==========================================================
   汇出
   ========================================================== */
function exportCsv() {
  if (!records.length) { showMsg('未有记录可汇出', 'bad'); return; }
  const header = ['序号','条码号码','PO / 收货单号','时间','相片档名'];
  const rows = records.map((r, i) => [
    i + 1,
    r.barcode,
    r.poNo || '',
    r.time,
    `${i + 1}_${r.barcode}_${r.poNo || 'photo'}.jpg`
  ]);
  const csv = '\uFEFF' + [header, ...rows]
    .map(row => row.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(','))
    .join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '收货记录_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  showMsg('已汇出 CSV', 'ok');
}

async function exportZip() {
  if (!records.length) { showMsg('未有记录可汇出', 'bad'); return; }
  if (typeof JSZip === 'undefined') { showMsg('打包套件未载入，请检查网络', 'bad'); return; }

  showMsg('正在打包...', 'ok');

  try {
    const zip = new JSZip();
    const photoFolder = zip.folder('Photos');
    const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');

    let csv = '\uFEFF序号,条码,PO,时间,相片档名\r\n';
    const cell = v => '"' + String(v).replace(/"/g, '""') + '"';

    for (let i = 0; i < records.length; i++) {
      const r = records[i];
      const seq = String(i + 1).padStart(4, '0');
      const filename = `${r.barcode}_${dateStr}_${seq}.jpg`;

      if (r.photoBlob) {
        try {
          // Blob -> ArrayBuffer 交给 JSZip
          const ab = await r.photoBlob.arrayBuffer();
          photoFolder.file(filename, ab);
        } catch (e) { console.warn('照片读取失败', filename, e); }
      }

      csv += [i + 1, r.barcode, r.poNo || '', r.time, filename].map(cell).join(',') + '\r\n';
    }

    zip.file('Delivery_Report.csv', csv);

    const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/zip' });
    const filename = `Delivery_Archive_${dateStr}.zip`;
    const zipFile = new File([blob], filename, { type: 'application/zip' });

    if (navigator.canShare && navigator.canShare({ files: [zipFile] })) {
      try {
        await navigator.share({
          title: '收货记录与照片',
          text: `共 ${records.length} 单`,
          files: [zipFile]
        });
        showMsg('已开启分享', 'ok');
        return;
      } catch (err) {
        if (err.name === 'AbortError') return;
      }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    showMsg('已下载 ZIP', 'ok');
  } catch (e) {
    console.error(e);
    showMsg('打包失败：' + (e.message || '未知'), 'bad');
  }
}

/* ==========================================================
   工具
   ========================================================== */
function showMsg(text, type) {
  const el = document.getElementById('statusBanner');
  el.textContent = text;
  if (type === 'ok') {
    el.style.background = '#d1fae5'; el.style.color = '#065f46'; el.style.borderColor = '#10b981';
  } else if (type === 'bad') {
    el.style.background = '#fee2e2'; el.style.color = '#991b1b'; el.style.borderColor = '#ef4444';
  } else {
    el.style.background = '#fef3c7'; el.style.color = '#78350f'; el.style.borderColor = '#d97706';
  }
  el.classList.add('show');
  clearTimeout(window._msgTimer);
  window._msgTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1050, ctx.currentTime);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.12);
  } catch (e) {}
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function updateStorage() {
  const el = document.getElementById('storageInfo');
  if (!el) return;
  if (!navigator.storage || !navigator.storage.estimate) {
    el.textContent = '';
    return;
  }
  try {
    const { usage } = await navigator.storage.estimate();
    el.textContent = '已用储存：' + formatBytes(usage);
  } catch (e) { el.textContent = ''; }
}

function formatBytes(b) {
  if (!b || b <= 0) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(i ? 1 : 0) + ' ' + u[i];
}

/* ==========================================================
   启动
   ========================================================== */
async function init() {
  try {
    db = await openDB();
    await migrateLegacy();
    const all = await dbGetAll();
    all.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    records = all;
    renderBadge();
    renderRecords();
    updateStorage();
  } catch (e) {
    console.error('初始化失败', e);
    showMsg('数据库初始化失败：' + (e.message || '未知'), 'bad');
  }
}
init();

/* 全局错误兜底 */
window.addEventListener('error', function (e) {
  const el = document.getElementById('statusBanner');
  if (el) {
    el.textContent = '程式错误：' + (e.message || '未知');
    el.style.background = '#fee2e2';
    el.style.color = '#991b1b';
    el.style.borderColor = '#ef4444';
    el.classList.add('show');
  }
});
</script>
