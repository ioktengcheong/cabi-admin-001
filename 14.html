<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRN OCR & Door Dispatch (Simple)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; color: #0f172a; padding: 14px; }
    .app { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .top { background: #0f172a; color: #fff; padding: 12px 16px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .top h1 { font-size: 15px; }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button { border: none; border-radius: 7px; padding: 8px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .blue { background: #2563eb; color: #fff; }
    .green { background: #10b981; color: #052e16; }
    .amber { background: #f59e0b; color: #111827; }
    .light { background: #e2e8f0; color: #0f172a; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .stage-wrap { position: relative; background: #0f172a; border-radius: 8px; height: 310px; display: flex; align-items: center; justify-content: center; overflow: hidden; color: #94a3b8; font-size: 12px; }
    .stage { position: relative; display: inline-flex; max-width: 100%; max-height: 100%; }
    .stage canvas { max-width: 100%; max-height: 310px; display: block; }
    .red-box { position: absolute; border: 2.5px solid #ef4444; background: rgba(239, 68, 68, 0.2); pointer-events: none; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 4px; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #94a3b8; border-radius: 7px; font-family: ui-monospace, monospace; font-size: 13px; }
    .door { background: #fef08a; border-color: #eab308; font-weight: 800; font-size: 16px; text-align: center; }
    .red-text { color: #dc2626; font-weight: 700; border-color: #fca5a5; background: #fef2f2; }
    .msg { font-size: 12px; background: #f8fafc; border: 1px solid #e2e8f0; padding: 8px 10px; border-radius: 7px; }
    .table-box { background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; }
    tr.active { background: #eff6ff; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <input type="file" id="fileInput" accept="image/*" multiple class="hidden" />

  <div class="app">
    <div class="top">
      <div>
        <h1>GRN OCR &amp; Door Dispatch (Simple)</h1>
      </div>
      <div class="btns">
        <button id="btnLoad" class="blue">+ Load GRNs (1–100)</button>
        <button id="btnScanAll" class="amber">Scan All</button>
        <button id="btnStop" class="light" disabled>Stop</button>
        <button id="btnExport" class="green">Export Excel</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div id="stageWrap" class="stage-wrap">No GRN images loaded</div>
        <div class="btns">
          <button id="btnRotate" class="light">↻ 90°</button>
          <button id="btnScanOne" class="blue">Scan Current</button>
          <button id="btnPrev" class="light">Prev</button>
          <button id="btnNext" class="light">Next</button>
          <span id="counter" style="margin-left:auto; font-size:12px; font-weight:600; color:#64748b;">0 / 0</span>
        </div>
        <div id="msg" class="msg">Load GRN images (up to 100). Scanner input auto-maps the last 2 digits to Door #.</div>
      </div>

      <div class="card">
        <div class="row-2">
          <div>
            <label for="pw">Password (Scanner / Type)</label>
            <input id="pw" type="text" inputmode="numeric" placeholder="Scan or enter password" />
          </div>
          <div>
            <label for="door">Door # (Last 2 Digits)</label>
            <input id="door" type="text" class="door" maxlength="2" placeholder="--" />
          </div>
        </div>

        <div class="row-2">
          <div>
            <label for="po">PO Number (3401...)</label>
            <input id="po" type="text" placeholder="3401xxxxxx" />
          </div>
          <div>
            <label for="pr">PR / Requester</label>
            <input id="pr" type="text" placeholder="PR # or Requester" />
          </div>
        </div>

        <div>
          <label for="items">Item Code(s) — Highlighted in Red</label>
          <input id="items" type="text" class="red-text" placeholder="e.g. XF28100109, XA02100058" />
        </div>

        <div>
          <label for="buEmail">BU Email (for Outlook)</label>
          <input id="buEmail" type="email" placeholder="bu-team@company.com" />
        </div>

        <div class="btns">
          <button id="btnSaveNext" class="green">Save &amp; Next</button>
          <button id="btnOutlook" class="blue">Open in Outlook</button>
          <button id="btnCopy" class="light">Copy Summary</button>
          <button id="btnDelete" class="light">Delete</button>
        </div>
      </div>
    </div>

    <div class="table-box">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>File</th>
            <th>Password</th>
            <th>Door #</th>
            <th>PO</th>
            <th>PR / Requester</th>
            <th>Item Codes</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="8" style="text-align:center; color:#94a3b8; padding:16px;">No records</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const state = { rows: [], idx: -1, worker: null, running: false, stop: false };
    const $ = id => document.getElementById(id);
    const cur = () => state.rows[state.idx] || null;

    function setPassword(val, row = cur()) {
      const clean = String(val || "").replace(/\D/g, "");
      const door = clean.length >= 2 ? clean.slice(-2) : "";
      if (row) { row.pw = clean; row.door = door; }
      if (!row || row === cur()) {
        $("pw").value = clean;
        $("door").value = door;
      }
      renderTable();
    }

    function parseOcr(text) {
      const clean = String(text || "").replace(/[|]/g, "I");
      const digits = clean.replace(/[Oo]/g, "0").replace(/[Il]/g, "1").replace(/\D/g, "");
      const po = (digits.match(/3401\d{6}/) || [])[0] || "";

      const lines = clean.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      let pr = "";
      for (let i = 0; i < lines.length; i++) {
        if (/pr\s*#?|requestor|requester/i.test(lines[i])) {
          const block = [lines[i], lines[i + 1] || ""].join(" ");
          const m = block.match(/([A-Za-z]{2,}\.[A-Za-z]{1,}|08\d{6}|PR[-:]?\w+)/i);
          if (m) { pr = m[1].toLowerCase(); break; }
        }
      }
      if (!pr) {
        const m = clean.match(/\b([a-z]{2,}\.[a-z]{1,}|08\d{6})\b/i);
        if (m) pr = m[1].toLowerCase();
      }

      const codes = [];
      const seen = new Set();
      for (const m of clean.match(/\b[A-Z]{2,4}\d{6,10}\b/g) || []) {
        if (!m.startsWith("3401") && !["PRG", "MOP", "USD", "HKD"].some(p => m.startsWith(p)) && !seen.has(m)) {
          seen.add(m);
          codes.push(m);
        }
      }

      return { po, pr, codes };
    }

    function makeCanvas(img, rot = 0, maxDim = 2200, gray = false) {
      const rad = (rot * Math.PI) / 180;
      const sin = Math.abs(Math.sin(rad)), cos = Math.abs(Math.cos(rad));
      const sw = img.naturalWidth, sh = img.naturalHeight;
      const rw = sw * cos + sh * sin, rh = sw * sin + sh * cos;
      const scale = Math.min(1, maxDim / Math.max(rw, rh));

      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(rw * scale));
      c.height = Math.max(1, Math.round(rh * scale));
      const ctx = c.getContext("2d", { willReadFrequently: true });
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.save();
      ctx.translate(c.width / 2, c.height / 2);
      ctx.rotate(rad);
      ctx.drawImage(img, -(sw * scale) / 2, -(sh * scale) / 2, sw * scale, sh * scale);
      ctx.restore();

      if (gray) {
        const d = ctx.getImageData(0, 0, c.width, c.height);
        const px = d.data;
        for (let i = 0; i < px.length; i += 4) {
          const g = Math.min(255, Math.max(0, (px[i] * 0.3 + px[i + 1] * 0.59 + px[i + 2] * 0.11 - 128) * 1.3 + 128));
          px[i] = px[i + 1] = px[i + 2] = g;
        }
        ctx.putImageData(d, 0, 0);
      }
      return c;
    }

    async function getOcr() {
      if (!state.worker) state.worker = await Tesseract.createWorker("eng");
      return state.worker;
    }

    async function scanOne(row) {
      if (!row || !row.img) return;
      row.status = "Scanning...";
      renderTable();
      $("msg").textContent = `Scanning ${row.name}...`;

      const c = makeCanvas(row.img, row.rot, 2400, true);
      const worker = await getOcr();
      await worker.setParameters({ preserve_interword_spaces: "1", tessedit_pageseg_mode: "6" });
      const res = await worker.recognize(c);

      const parsed = parseOcr(res.data.text || "");
      row.po = parsed.po || row.po;
      row.pr = parsed.pr || row.pr;
      row.codes = parsed.codes.length ? parsed.codes : row.codes;
      row.words = res.data.words || [];
      row.ocrW = c.width;
      row.ocrH = c.height;
      row.status = row.po ? "Scanned" : "Check";

      if (row === cur()) fillInputs(row);
      renderPreview();
      renderTable();
      $("msg").textContent = `${row.name} → PO: ${row.po || "—"} | PR/Req: ${row.pr || "—"} | Items: ${row.codes.join(", ") || "—"}`;
    }

    async function scanAll() {
      if (state.running || !state.rows.length) return;
      state.running = true;
      state.stop = false;
      $("btnScanAll").disabled = true;
      $("btnStop").disabled = false;

      for (let i = 0; i < state.rows.length; i++) {
        if (state.stop) break;
        state.idx = i;
        fillInputs(state.rows[i]);
        await scanOne(state.rows[i]);
      }

      state.running = false;
      state.stop = false;
      $("btnScanAll").disabled = false;
      $("btnStop").disabled = true;
    }

    function renderPreview() {
      const row = cur();
      $("counter").textContent = `${state.rows.length ? state.idx + 1 : 0} / ${state.rows.length}`;
      if (!row) { $("stageWrap").innerHTML = "No GRN images loaded"; return; }

      const c = makeCanvas(row.img, row.rot, 1200, false);
      const stage = document.createElement("div");
      stage.className = "stage";
      stage.appendChild(c);
      $("stageWrap").innerHTML = "";
      $("stageWrap").appendChild(stage);

      requestAnimationFrame(() => {
        const rect = c.getBoundingClientRect();
        if (!rect.width || !row.words?.length || !row.codes?.length) return;
        const set = new Set(row.codes.map(x => x.toUpperCase()));
        for (const w of row.words) {
          const clean = String(w.text || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
          if (set.has(clean) && w.bbox) {
            const box = document.createElement("div");
            box.className = "red-box";
            box.style.left = `${(w.bbox.x0 / row.ocrW) * rect.width}px`;
            box.style.top = `${(w.bbox.y0 / row.ocrH) * rect.height}px`;
            box.style.width = `${Math.max(12, ((w.bbox.x1 - w.bbox.x0) / row.ocrW) * rect.width)}px`;
            box.style.height = `${Math.max(10, ((w.bbox.y1 - w.bbox.y0) / row.ocrH) * rect.height)}px`;
            stage.appendChild(box);
          }
        }
      });
    }

    function fillInputs(row) {
      $("pw").value = row?.pw || "";
      $("door").value = row?.door || "";
      $("po").value = row?.po || "";
      $("pr").value = row?.pr || "";
      $("items").value = (row?.codes || []).join(", ");
    }

    function renderTable() {
      if (!state.rows.length) {
        $("tbody").innerHTML = `<tr><td colspan="8" style="text-align:center; color:#94a3b8; padding:16px;">No records</td></tr>`;
        return;
      }
      $("tbody").innerHTML = state.rows.map((r, i) => `
        <tr class="${i === state.idx ? "active" : ""}" onclick="pickRow(${i})">
          <td>${i + 1}</td>
          <td>${r.name}</td>
          <td><b>${r.pw || "—"}</b></td>
          <td><b>${r.door || "—"}</b></td>
          <td>${r.po || "—"}</td>
          <td>${r.pr || "—"}</td>
          <td style="color:#dc2626; font-weight:700;">${(r.codes || []).join(", ") || "—"}</td>
          <td>${r.status}</td>
        </tr>
      `).join("");
    }

    window.pickRow = i => {
      state.idx = i;
      fillInputs(cur());
      renderPreview();
      renderTable();
    };

    function summaryText(row) {
      return [
        `Door #: ${row?.door || "—"}`,
        `Open Password: ${row?.pw || "—"}`,
        `PO Number: ${row?.po || "—"}`,
        `PR / Requester: ${row?.pr || "—"}`,
        `Item Codes: ${(row?.codes || []).join(", ") || "—"}`
      ].join("\n");
    }

    function openOutlook() {
      const row = cur();
      if (!row) return;
      const to = encodeURIComponent($("buEmail").value.trim());
      const subject = encodeURIComponent(`Door ${row.door || "--"} Access | PO ${row.po || ""} | PR ${row.pr || ""}`);
      const body = encodeURIComponent(summaryText(row));
      window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
    }

    $("btnLoad").onclick = () => $("fileInput").click();
    $("fileInput").onchange = e => {
      const files = Array.from(e.target.files || []).filter(f => f.type.startsWith("image/")).slice(0, 100 - state.rows.length);
      e.target.value = "";
      files.forEach(file => {
        const fr = new FileReader();
        fr.onload = ev => {
          const img = new Image();
          img.onload = () => {
            state.rows.push({ name: file.name, img, rot: 0, pw: "", door: "", po: "", pr: "", codes: [], words: [], ocrW: 1, ocrH: 1, status: "Queued" });
            if (state.idx === -1) state.idx = 0;
            fillInputs(cur());
            renderPreview();
            renderTable();
          };
          img.src = ev.target.result;
        };
        fr.readAsDataURL(file);
      });
    };

    $("btnScanOne").onclick = () => scanOne(cur());
    $("btnScanAll").onclick = scanAll;
    $("btnStop").onclick = () => { state.stop = true; };

    $("btnRotate").onclick = () => {
      const r = cur();
      if (!r) return;
      r.rot = (r.rot + 90) % 360;
      renderPreview();
    };

    $("btnPrev").onclick = () => { if (state.idx > 0) window.pickRow(state.idx - 1); };
    $("btnNext").onclick = () => { if (state.idx < state.rows.length - 1) window.pickRow(state.idx + 1); };

    $("btnSaveNext").onclick = () => {
      const r = cur();
      if (!r) return;
      r.status = "Saved";
      if (state.idx < state.rows.length - 1) window.pickRow(state.idx + 1);
      else renderTable();
    };

    $("btnDelete").onclick = () => {
      if (!cur()) return;
      state.rows.splice(state.idx, 1);
      state.idx = Math.min(state.idx, state.rows.length - 1);
      fillInputs(cur());
      renderPreview();
      renderTable();
    };

    $("btnOutlook").onclick = openOutlook;
    $("btnCopy").onclick = async () => {
      if (!cur()) return;
      await navigator.clipboard.writeText(summaryText(cur()));
      $("msg").textContent = "Copied Door, Password, PO, PR, and Item Codes to clipboard.";
    };

    $("btnExport").onclick = () => {
      if (!state.rows.length) return;
      const sheet = XLSX.utils.json_to_sheet(state.rows.map((r, i) => ({
        No: i + 1, File: r.name, Password: r.pw, Door: r.door,
        PO: r.po, PR_Requester: r.pr, ItemCodes: (r.codes || []).join(", "), Status: r.status
      })));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, sheet, "GRN");
      XLSX.writeFile(wb, "GRN_Door_Dispatch.xlsx");
    };

    $("pw").oninput = e => setPassword(e.target.value);
    $("door").oninput = e => { if (cur()) { cur().door = e.target.value.replace(/\D/g, "").slice(0, 2); renderTable(); } };
    $("po").oninput = e => { if (cur()) { cur().po = e.target.value.trim(); renderTable(); } };
    $("pr").oninput = e => { if (cur()) { cur().pr = e.target.value.trim(); renderTable(); } };
    $("items").oninput = e => {
      if (cur()) {
        cur().codes = e.target.value.split(/[,\s]+/).map(s => s.trim().toUpperCase()).filter(Boolean);
        renderPreview();
        renderTable();
      }
    };
  </script>
</body>
</html>
