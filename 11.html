<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRN Photo Scanner & OCR Export</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f1f5f9; color: #0f172a; padding: 14px; }
    .app { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .bar { background: #0f172a; color: #fff; padding: 12px 14px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .bar h1 { font-size: 15px; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    button { cursor: pointer; border: none; border-radius: 7px; padding: 8px 11px; font-size: 12px; font-weight: 600; }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-green { background: #10b981; color: #052e16; }
    .btn-light { background: #e2e8f0; color: #0f172a; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .preview-box { background: #0f172a; border-radius: 8px; height: 280px; display: flex; align-items: center; justify-content: center; overflow: hidden; color: #94a3b8; font-size: 12px; }
    .preview-box canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 4px; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #94a3b8; border-radius: 7px; font-family: monospace; font-size: 13px; }
    .door-box { background: #fef08a; border-color: #eab308; font-weight: 800; text-align: center; font-size: 16px; }
    .status { font-size: 12px; color: #334155; background: #f8fafc; border: 1px solid #e2e8f0; padding: 7px 10px; border-radius: 7px; }
    .table-wrap { background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; font-weight: 700; color: #334155; }
    tr.active { background: #eff6ff; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <input type="file" id="photoInput" accept="image/*" multiple class="hidden" />
  <div class="app">
    <div class="bar">
      <h1>GRN Scanner & OCR</h1>
      <div class="actions">
        <button id="btnAddPhoto" class="btn-blue">+ Insert Photo</button>
        <button id="btnExportXlsx" class="btn-green">Export .xlsx</button>
        <button id="btnExportCsv" class="btn-light">Export .csv</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="preview-box" id="previewBox">No photo inserted</div>
        <div class="actions">
          <button id="btnRotate" class="btn-light">↻ Rotate 90°</button>
          <button id="btnScanNow" class="btn-blue">Scan Photo</button>
          <button id="btnPrev" class="btn-light">Prev</button>
          <button id="btnNext" class="btn-light">Next</button>
          <span id="photoCounter" style="margin-left:auto; font-size:12px; color:#64748b;">0 / 0</span>
        </div>
        <div class="status" id="statusMsg">Insert a photo to start.</div>
      </div>

      <div class="card">
        <div class="row-2">
          <div>
            <label for="pwInput">1. Password (9 digits)</label>
            <input id="pwInput" type="text" placeholder="9-digit password" />
          </div>
          <div>
            <label for="doorInput">Door # (Auto Last 2)</label>
            <input id="doorInput" type="text" class="door-box" placeholder="--" />
          </div>
        </div>
        <div class="row-2">
          <div>
            <label for="poInput">2. PO Number (3401...)</label>
            <input id="poInput" type="text" placeholder="3401xxxxxx" />
          </div>
          <div>
            <label for="reqInput">Requestor (OCR)</label>
            <input id="reqInput" type="text" placeholder="username or 08xxxxxx" />
          </div>
        </div>
        <div class="actions">
          <button id="btnSaveNext" class="btn-green">Save & Next</button>
          <button id="btnDelete" class="btn-light">Delete</button>
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Photo</th>
            <th>Password</th>
            <th>Door #</th>
            <th>PO Number</th>
            <th>Requestor</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:18px;">No records yet</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const OCR_CONFIG = {
      poPrefix: "3401",
      poDigits: 10,
      passwordDigits: 9
    };

    const state = {
      items: [],
      activeIndex: -1,
      worker: null,
      scanning: false,
      workerInitialized: false
    };

    const el = {
      photoInput: document.getElementById("photoInput"),
      previewBox: document.getElementById("previewBox"),
      photoCounter: document.getElementById("photoCounter"),
      statusMsg: document.getElementById("statusMsg"),
      pwInput: document.getElementById("pwInput"),
      doorInput: document.getElementById("doorInput"),
      poInput: document.getElementById("poInput"),
      reqInput: document.getElementById("reqInput"),
      tableBody: document.getElementById("tableBody")
    };

    function current() {
      return state.items[state.activeIndex] || null;
    }

    function applyPassword(rawPassword, item = current()) {
      if (!item) {
        return;
      }

      const digits = String(rawPassword || "")
        .replace(/\D/g, "");

      if (digits.length === OCR_CONFIG.passwordDigits) {
        item.password = digits;
        item.door = digits.slice(-2);
      } else {
        item.password = "";
        item.door = "";
      }
    }

    function getRotatedCanvas(img, rotation = 0, options = {}) {
      const {
        scale = 1,
        maxDimension = 3600,
        removeRedInk = true,
        grayscale = true,
        contrast = 1.25,
        threshold = 0
      } = options;

      const radians = rotation * Math.PI / 180;
      const sin = Math.abs(Math.sin(radians));
      const cos = Math.abs(Math.cos(radians));

      const sourceWidth =
        img.naturalWidth || img.width;

      const sourceHeight =
        img.naturalHeight || img.height;

      const rotatedWidth =
        sourceWidth * cos + sourceHeight * sin;

      const rotatedHeight =
        sourceWidth * sin + sourceHeight * cos;

      const fitScale =
        Math.min(
          1,
          maxDimension /
          Math.max(rotatedWidth, rotatedHeight)
        );

      const finalScale = fitScale * scale;

      const canvasWidth =
        Math.max(
          1,
          Math.round(rotatedWidth * finalScale)
        );

      const canvasHeight =
        Math.max(
          1,
          Math.round(rotatedHeight * finalScale)
        );

      const canvas =
        document.createElement("canvas");

      canvas.width = canvasWidth;
      canvas.height = canvasHeight;

      const ctx = canvas.getContext("2d", {
        willReadFrequently: true
      });

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      ctx.save();
      ctx.translate(canvasWidth / 2, canvasHeight / 2);
      ctx.rotate(radians);

      ctx.drawImage(
        img,
        -(sourceWidth * finalScale) / 2,
        -(sourceHeight * finalScale) / 2,
        sourceWidth * finalScale,
        sourceHeight * finalScale
      );

      ctx.restore();

      if (
        removeRedInk ||
        grayscale ||
        threshold > 0
      ) {
        const imageData =
          ctx.getImageData(
            0,
            0,
            canvasWidth,
            canvasHeight
          );

        const pixels = imageData.data;

        for (let i = 0; i < pixels.length; i += 4) {
          const red = pixels[i];
          const green = pixels[i + 1];
          const blue = pixels[i + 2];

          const isRedInk =
            red > 150 &&
            red > green * 1.25 &&
            red > blue * 1.25 &&
            red - blue > 45;

          if (removeRedInk && isRedInk) {
            pixels[i] = 255;
            pixels[i + 1] = 255;
            pixels[i + 2] = 255;
            continue;
          }

          if (grayscale) {
            let gray =
              red * 0.299 +
              green * 0.587 +
              blue * 0.114;

            if (contrast !== 1) {
              gray =
                (gray - 128) * contrast + 128;
            }

            gray = Math.max(
              0,
              Math.min(255, gray)
            );

            if (threshold > 0) {
              gray =
                gray >= threshold
                  ? 255
                  : 0;
            }

            pixels[i] = gray;
            pixels[i + 1] = gray;
            pixels[i + 2] = gray;
          }
        }

        ctx.putImageData(imageData, 0, 0);
      }

      return canvas;
    }

    function cropCanvas(
      source,
      x,
      y,
      width,
      height,
      padding = 0
    ) {
      const sx =
        Math.max(
          0,
          Math.round(x - padding)
        );

      const sy =
        Math.max(
          0,
          Math.round(y - padding)
        );

      const sw =
        Math.max(
          1,
          Math.min(
            source.width - sx,
            Math.round(width + padding * 2)
          )
        );

      const sh =
        Math.max(
          1,
          Math.min(
            source.height - sy,
            Math.round(height + padding * 2)
          )
        );

      const canvas =
        document.createElement("canvas");

      canvas.width = sw;
      canvas.height = sh;

      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, sw, sh);

      ctx.drawImage(
        source,
        sx,
        sy,
        sw,
        sh,
        0,
        0,
        sw,
        sh
      );

      return canvas;
    }

    async function getWorker() {
      if (state.worker) {
        return state.worker;
      }

      state.worker =
        await Tesseract.createWorker("eng");

      await state.worker.setParameters({
        preserve_interword_spaces: "1",
        tessedit_pageseg_mode: "11"
      });

      state.workerInitialized = true;
      return state.worker;
    }

    async function recognise(
      canvas,
      whitelist = "",
      pageSegMode = "11"
    ) {
      const worker = await getWorker();

      await worker.setParameters({
        preserve_interword_spaces: "1",
        tessedit_pageseg_mode: pageSegMode,
        tessedit_char_whitelist: whitelist
      });

      const output =
        await worker.recognize(canvas);

      return {
        text: output.data.text || "",
        confidence:
          Number(output.data.confidence || 0)
      };
    }

    function digitsOnly(text) {
      return String(text || "")
        .replace(/[Oo]/g, "0")
        .replace(/[Il|]/g, "1")
        .replace(/[Ss]/g, "5")
        .replace(/\D/g, "");
    }

    function extractPoNumber(text) {
      const digits = digitsOnly(text);
      const matches =
        digits.match(/\d{10}/g) || [];

      for (const candidate of matches) {
        if (
          candidate.startsWith(
            OCR_CONFIG.poPrefix
          )
        ) {
          return candidate;
        }
      }

      return "";
    }

    function extractPassword(text) {
      const digits = digitsOnly(text);
      const matches =
        digits.match(/\d{9}/g) || [];

      for (const candidate of matches) {
        if (
          !candidate.startsWith("2056")
        ) {
          return candidate;
        }
      }

      return "";
    }

    function extractRequester(text) {
      const lines = String(text || "")
        .replace(/[|]/g, "I")
        .split(/\n/)
        .map(line => line.trim())
        .filter(Boolean);

      for (const line of lines) {
        const username =
          line.match(
            /\b[A-Za-z]{2,20}\.[A-Za-z]{1,20}\b/
          );

        if (
          username &&
          username[0]
            .toLowerCase() !== "com"
        ) {
          return username[0].toLowerCase();
        }

        const employeeNumber =
          line.match(/\b08\d{6}\b/);

        if (employeeNumber) {
          return employeeNumber[0];
        }
      }

      return "";
    }

    function parseOcr(text, item) {
      if (!item) {
        return;
      }

      if (!item.po) {
        item.po =
          extractPoNumber(text);
      }

      if (!item.password) {
        item.password =
          extractPassword(text);

        if (item.password) {
          applyPassword(
            item.password,
            item
          );
        }
      }

      if (!item.requester) {
        item.requester =
          extractRequester(text);
      }
    }

    async function scanBarcodeFromCanvas(canvas) {
      if ("BarcodeDetector" in window) {
        try {
          const detector =
            new BarcodeDetector({
              formats: [
                "code_128",
                "code_39",
                "ean_13",
                "ean_8",
                "upc_a",
                "qr_code"
              ]
            });

          const results =
            await detector.detect(canvas);

          for (const result of results) {
            const raw =
              String(
                result.rawValue || ""
              ).trim();

            if (/^\d{9}$/.test(raw)) {
              return raw;
            }

            const digits =
              raw.replace(/\D/g, "");

            if (/^\d{9}$/.test(digits)) {
              return digits;
            }
          }
        } catch (error) {
          // Try ZXing next.
        }
      }

      if (window.ZXingBrowser) {
        try {
          const hints = new Map();

          if (
            ZXingBrowser.DecodeHintType
          ) {
            hints.set(
              ZXingBrowser
                .DecodeHintType
                .TRY_HARDER,
              true
            );

            hints.set(
              ZXingBrowser
                .DecodeHintType
                .POSSIBLE_FORMATS,
              [
                ZXingBrowser
                  .BarcodeFormat
                  .CODE_128,
                ZXingBrowser
                  .BarcodeFormat
                  .CODE_39,
                ZXingBrowser
                  .BarcodeFormat
                  .EAN_13
              ]
            );
          }

          const reader =
            new ZXingBrowser
              .BrowserMultiFormatReader(
                hints
              );

          const result =
            await reader.decodeFromImageUrl(
              canvas.toDataURL("image/png")
            );

          if (result) {
            const raw =
              String(
                result.getText() || ""
              ).trim();

            const digits =
              raw.replace(/\D/g, "");

            if (/^\d{9}$/.test(digits)) {
              return digits;
            }
          }
        } catch (error) {
          // Barcode unavailable.
        }
      }

      return "";
    }

    async function scanItem(item) {
      if (!item || !item.img) {
        return;
      }

      el.statusMsg.textContent =
        `Scanning ${item.name}...`;

      const barcodeCanvas =
        getRotatedCanvas(
          item.img,
          item.rotation || 0,
          {
            scale: 1,
            maxDimension: 3200,
            removeRedInk: false,
            grayscale: false
          }
        );

      const barcodePassword =
        await scanBarcodeFromCanvas(
          barcodeCanvas
        );

      if (barcodePassword) {
        applyPassword(
          barcodePassword,
          item
        );
      }

      const ocrCanvas =
        getRotatedCanvas(
          item.img,
          item.rotation || 0,
          {
            scale: 1.25,
            maxDimension: 3600,
            removeRedInk: true,
            grayscale: true,
            contrast: 1.25
          }
        );

      const pageResult =
        await recognise(
          ocrCanvas,
          "",
          "11"
        );

      parseOcr(
        pageResult.text,
        item
      );

      if (!item.po || !item.password) {
        const numericCanvas =
          getRotatedCanvas(
            item.img,
            item.rotation || 0,
            {
              scale: 1.5,
              maxDimension: 4200,
              removeRedInk: true,
              grayscale: true,
              contrast: 1.4,
              threshold: 180
            }
          );

        const numericResult =
          await recognise(
            numericCanvas,
            "0123456789",
            "11"
          );

        if (!item.po) {
          item.po =
            extractPoNumber(
              numericResult.text
            );
        }

        if (
          !item.password &&
          !barcodePassword
        ) {
          item.password =
            extractPassword(
              numericResult.text
            );

          if (item.password) {
            applyPassword(
              item.password,
              item
            );
          }
        }
      }

      if (!item.po) {
        const poCrop =
          cropCanvas(
            ocrCanvas,
            ocrCanvas.width * 0.58,
            ocrCanvas.height * 0.18,
            ocrCanvas.width * 0.34,
            ocrCanvas.height * 0.16,
            ocrCanvas.width * 0.01
          );

        const poResult =
          await recognise(
            poCrop,
            "0123456789",
            "7"
          );

        item.po =
          extractPoNumber(
            poResult.text
          );
      }

      if (!item.requester) {
        const requesterCrop =
          cropCanvas(
            ocrCanvas,
            ocrCanvas.width * 0.02,
            ocrCanvas.height * 0.20,
            ocrCanvas.width * 0.36,
            ocrCanvas.height * 0.20,
            ocrCanvas.width * 0.01
          );

        const requesterResult =
          await recognise(
            requesterCrop,
            "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.",
            "7"
          );

        item.requester =
          extractRequester(
            requesterResult.text
          );
      }

      el.statusMsg.textContent =
        `PW: ${item.password || "—"} | ` +
        `Door: ${item.door || "—"} | ` +
        `PO: ${item.po || "—"} | ` +
        `Req: ${item.requester || "—"}`;
    }

    async function scanAllQueue(startIndex) {
      if (state.scanning) {
        return;
      }

      state.scanning = true;

      for (
        let i = startIndex;
        i < state.items.length;
        i++
      ) {
        await scanItem(
          state.items[i]
        );

        renderTableOnly();

        if (i === state.activeIndex) {
          renderInputsOnly();

          const item =
            state.items[state.activeIndex];

          el.statusMsg.textContent =
            `PW: ${item.password || "—"} | ` +
            `Door: ${item.door || "—"} | ` +
            `PO: ${item.po || "—"} | ` +
            `Req: ${item.requester || "—"}`;
        }
      }

      state.scanning = false;
      render();
    }

    function addFiles(files) {
      const validFiles =
        Array.from(files).filter(file =>
          file.type.startsWith("image/")
        );

      if (!validFiles.length) {
        return;
      }

      const firstNewIndex =
        state.items.length;

      let loadedCount = 0;

      validFiles.forEach(file => {
        const reader =
          new FileReader();

        reader.onload =
          event => {
            const img =
              new Image();

            img.onload = () => {
              const autoRotation =
                img.height >
                img.width * 1.15
                  ? 270
                  : 0;

              state.items.push({
                name: file.name,
                url: event.target.result,
                img,
                rotation: autoRotation,
                password: "",
                door: "",
                po: "",
                requester: ""
              });

              loadedCount++;

              if (
                state.activeIndex === -1
              ) {
                state.activeIndex = 0;
              }

              render();

              if (
                loadedCount ===
                validFiles.length
              ) {
                scanAllQueue(
                  firstNewIndex
                );
              }
            };

            img.src =
              event.target.result;
          };

        reader.readAsDataURL(file);
      });
    }

    function renderPreview() {
      const item = current();

      el.photoCounter.textContent =
        `${state.items.length
          ? state.activeIndex + 1
          : 0
        } / ${state.items.length}`;

      if (!item) {
        el.previewBox.innerHTML =
          "No photo inserted";
        return;
      }

      const canvas =
        getRotatedCanvas(
          item.img,
          item.rotation || 0,
          {
            scale: 1,
            maxDimension: 2400,
            removeRedInk: false,
            grayscale: false
          }
        );

      el.previewBox.innerHTML = "";
      el.previewBox.appendChild(canvas);
    }

    function renderInputsOnly() {
      const item = current();

      if (!item) {
        el.pwInput.value = "";
        el.doorInput.value = "";
        el.poInput.value = "";
        el.reqInput.value = "";
        return;
      }

      el.pwInput.value =
        item.password || "";

      el.doorInput.value =
        item.door || "";

      el.poInput.value =
        item.po || "";

      el.reqInput.value =
        item.requester || "";
    }

    function renderTableOnly() {
      if (!state.items.length) {
        el.tableBody.innerHTML =
          `<tr>
            <td colspan="6"
                style="text-align:center;
                       color:#94a3b8;
                       padding:18px;">
              No records yet
            </td>
          </tr>`;
        return;
      }

      el.tableBody.innerHTML =
        state.items
          .map((item, index) => `
            <tr
              class="${
                index === state.activeIndex
                  ? "active"
                  : ""
              }"
              onclick="selectRow(${index})"
            >
              <td>${index + 1}</td>
              <td>${item.name}</td>
              <td><b>${item.password || "—"}</b></td>
              <td><b>${item.door || "—"}</b></td>
              <td>${item.po || "—"}</td>
              <td>${item.requester || "—"}</td>
            </tr>
          `)
          .join("");
    }

    function render() {
      renderPreview();
      renderInputsOnly();
      renderTableOnly();
    }

    window.selectRow = index => {
      state.activeIndex = index;
      render();

      const item = current();

      if (item) {
        el.statusMsg.textContent =
          `PW: ${item.password || "—"} | ` +
          `Door: ${item.door || "—"} | ` +
          `PO: ${item.po || "—"} | ` +
          `Req: ${item.requester || "—"}`;
      }
    };

    function exportRows() {
      return state.items.map(
        (item, index) => ({
          "No": index + 1,
          "Photo": item.name,
          "Password": item.password,
          "Door #": item.door,
          "PO Number": item.po,
          "Requestor": item.requester
        })
      );
    }

    function exportXlsx() {
      if (!state.items.length) {
        return;
      }

      const sheet =
        XLSX.utils.json_to_sheet(
          exportRows()
        );

      const workbook =
        XLSX.utils.book_new();

      XLSX.utils.book_append_sheet(
        workbook,
        sheet,
        "GRN"
      );

      XLSX.writeFile(
        workbook,
        `GRN_${
          new Date()
            .toISOString()
            .slice(0, 10)
        }.xlsx`
      );
    }

    function exportCsv() {
      if (!state.items.length) {
        return;
      }

      const rows = exportRows();
      const keys = Object.keys(rows[0]);

      const csv =
        "\uFEFF" +
        [
          keys.join(","),
          ...rows.map(row =>
            keys
              .map(key =>
                `"${String(
                  row[key] ?? ""
                ).replace(/"/g, '""')}"`
              )
              .join(",")
          )
        ].join("\n");

      const link =
        document.createElement("a");

      link.href =
        URL.createObjectURL(
          new Blob(
            [csv],
            {
              type:
                "text/csv;charset=utf-8;"
            }
          )
        );

      link.download =
        `GRN_${
          new Date()
            .toISOString()
            .slice(0, 10)
        }.csv`;

      link.click();
    }

    document
      .getElementById("btnAddPhoto")
      .onclick =
        () => el.photoInput.click();

    el.photoInput.onchange =
      event => {
        addFiles(
          event.target.files
        );

        event.target.value = "";
      };

    document
      .getElementById("btnRotate")
      .onclick =
        async () => {
          const item = current();

          if (!item) {
            return;
          }

          item.rotation =
            (
              (item.rotation || 0) +
              90
            ) % 360;

          item.password = "";
          item.door = "";
          item.po = "";
          item.requester = "";

          renderPreview();

          await scanItem(item);

          renderInputsOnly();
          renderTableOnly();
        };

    document
      .getElementById("btnScanNow")
      .onclick =
        async () => {
          const item = current();

          if (!item) {
            return;
          }

          await scanItem(item);

          renderInputsOnly();
          renderTableOnly();
        };

    document
      .getElementById("btnPrev")
      .onclick =
        () => {
          if (
            state.activeIndex > 0
          ) {
            state.activeIndex--;
            window.selectRow(
              state.activeIndex
            );
          }
        };

    document
      .getElementById("btnNext")
      .onclick =
        () => {
          if (
            state.activeIndex <
            state.items.length - 1
          ) {
            state.activeIndex++;
            window.selectRow(
              state.activeIndex
            );
          }
        };

    document
      .getElementById("btnSaveNext")
      .onclick =
        () => {
          if (
            state.activeIndex <
            state.items.length - 1
          ) {
            state.activeIndex++;
            window.selectRow(
              state.activeIndex
            );
          }
        };

    document
      .getElementById("btnDelete")
      .onclick =
        () => {
          if (!current()) {
            return;
          }

          state.items.splice(
            state.activeIndex,
            1
          );

          state.activeIndex =
            Math.min(
              state.activeIndex,
              state.items.length - 1
            );

          render();
        };

    el.pwInput.oninput =
      event => {
        applyPassword(
          event.target.value
        );

        renderInputsOnly();
        renderTableOnly();
      };

    el.doorInput.oninput =
      event => {
        if (current()) {
          current().door =
            event.target.value
              .trim();

          renderTableOnly();
        }
      };

    el.poInput.oninput =
      event => {
        if (current()) {
          current().po =
            event.target.value
              .trim();

          renderTableOnly();
        }
      };

    el.reqInput.oninput =
      event => {
        if (current()) {
          current().requester =
            event.target.value
              .trim();

          renderTableOnly();
        }
      };

    document
      .getElementById("btnExportXlsx")
      .onclick =
        exportXlsx;

    document
      .getElementById("btnExportCsv")
      .onclick =
        exportCsv;
  </script>
</body>
</html>
