<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>自助櫃條碼及收貨單</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f4f6f9;
      --ink: #0f172a;
      --sub: #334155;
      --line: #94a3b8;
      --blue: #0047ab;
      --blue-dark: #002d72;
      --green: #0f766e;
      --green-dark: #094e49;
      --amber: #b45309;
      --red: #b91c1c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: rgba(0, 71, 171, 0.2);
    }

    body {
      margin: 0;
      padding: 18px;
      background: var(--bg);
      color: var(--ink);
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 28px;
      line-height: 1.45;
      font-weight: 700;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .title {
      font-size: 38px;
      font-weight: 900;
      margin: 0;
    }

    .badge {
      background: #dbeafe;
      color: var(--blue-dark);
      border: 3px solid var(--blue);
      border-radius: 14px;
      padding: 8px 18px;
      font-size: 28px;
      font-weight: 900;
      white-space: nowrap;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .step-tab {
      border: 3px solid var(--line);
      background: var(--surface);
      color: var(--sub);
      border-radius: 16px;
      padding: 16px 10px;
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      cursor: pointer;
    }

    .step-tab.active {
      background: var(--blue);
      color: #ffffff;
      border-color: var(--blue-dark);
    }

    .step-tab.done {
      background: #ccfbf1;
      color: var(--green-dark);
      border-color: var(--green);
    }

    .card {
      border: 3px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      background: #ffffff;
    }

    .label {
      display: block;
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 10px;
      color: var(--ink);
    }

    input[type="text"] {
      width: 100%;
      font-size: 36px;
      font-weight: 900;
      padding: 16px 18px;
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: #ffffff;
      color: var(--ink);
      letter-spacing: 1px;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
    }

    .btn-row.single {
      grid-template-columns: 1fr;
    }

    button {
      border: 3px solid transparent;
      border-radius: 16px;
      padding: 18px 16px;
      font-size: 32px;
      font-weight: 900;
      cursor: pointer;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 76px;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-blue {
      background: var(--blue);
      border-color: var(--blue-dark);
    }

    .btn-green {
      background: var(--green);
      border-color: var(--green-dark);
    }

    .btn-gray {
      background: #334155;
      border-color: #0f172a;
    }

    .btn-amber {
      background: var(--amber);
      border-color: #78350f;
    }

    .btn-red {
      background: var(--red);
      border-color: #7f1d1d;
    }

    .btn-small {
      min-height: 62px;
      padding: 12px 16px;
      font-size: 28px;
    }

    .scanner-box {
      margin-top: 14px;
      border: 3px solid var(--ink);
      border-radius: 16px;
      overflow: hidden;
      background: #000000;
      display: none;
    }

    .scanner-box.open {
      display: block;
    }

    video {
      width: 100%;
      max-height: 360px;
      display: block;
      object-fit: cover;
    }

    .png-box {
      margin-top: 18px;
      border: 3px solid var(--ink);
      border-radius: 16px;
      padding: 14px;
      background: #f8fafc;
      text-align: center;
    }

    .png-box img {
      max-width: 100%;
      height: auto;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
    }

    .photo-preview {
      margin-top: 16px;
      text-align: center;
    }

    .photo-preview img {
      max-width: 100%;
      max-height: 360px;
      border: 3px solid var(--ink);
      border-radius: 14px;
      display: none;
      margin: 0 auto;
    }

    .photo-preview img.show {
      display: block;
    }

    .status-banner {
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 16px;
      background: #fef3c7;
      color: #78350f;
      border: 3px solid #d97706;
      display: none;
    }

    .status-banner.show {
      display: block;
    }

    .record-item {
      border: 3px solid var(--ink);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      background: #f8fafc;
    }

    .record-main {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 8px;
      word-break: break-all;
    }

    .record-sub {
      font-size: 28px;
      font-weight: 700;
      color: var(--sub);
      margin-bottom: 12px;
    }

    .record-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 640px) {
      body {
        font-size: 26px;
        padding: 12px;
      }
      .title {
        font-size: 32px;
      }
      .step-tab {
        font-size: 26px;
        padding: 14px 6px;
      }
      button {
        font-size: 28px;
        min-height: 70px;
      }
      .btn-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <h1 class="title">自助櫃及收貨單</h1>
      <div class="badge" id="savedCountBadge">已存：0 單</div>
    </div>

    <div id="statusBanner" class="status-banner"></div>

    <div class="steps">
      <button type="button" class="step-tab active" id="tab1" onclick="goStep(1)">1. 掃條碼</button>
      <button type="button" class="step-tab" id="tab2" onclick="goStep(2)">2. 影收貨單</button>
      <button type="button" class="step-tab" id="tab3" onclick="goStep(3)">3. 匯出紀錄</button>
    </div>

    <!-- 第一步：掃條碼及轉 PNG 分享 -->
    <section id="step1" class="card">
      <label class="label" for="barcodeInput">條碼號碼</label>
      <input type="text" id="barcodeInput" placeholder="掃描或輸入號碼" oninput="onBarcodeInput()" />

      <div class="btn-row">
        <button type="button" class="btn-blue" id="scanBtn" onclick="toggleScanner()">開相機掃碼</button>
        <button type="button" class="btn-green" onclick="makePng()">轉 PNG 圖</button>
      </div>

      <div class="scanner-box" id="scannerBox">
        <video id="video" playsinline muted></video>
      </div>

      <div class="png-box">
        <div class="label" style="margin-bottom:8px;">給部門掃碼 PNG</div>
        <img id="pngImg" alt="條碼 PNG" />
        <canvas id="barcodeCanvas" style="display:none;"></canvas>
        <div class="btn-row" style="margin-top:14px;">
          <button type="button" class="btn-blue" onclick="shareOrDownloadPng()">分享／下載 PNG</button>
          <button type="button" class="btn-green" onclick="goStep(2)">下一步：影收貨單</button>
        </div>
      </div>
    </section>

    <!-- 第二步：影收貨單相片及儲存 -->
    <section id="step2" class="card hidden">
      <div class="label" id="activeCodeLabel">目前條碼：未填</div>

      <label class="label" for="grnNoInput">收貨單號（可不填）</label>
      <input type="text" id="grnNoInput" placeholder="輸入單號" />

      <div class="btn-row single" style="margin-top:16px;">
        <label for="grnFileInput" class="btn-blue" style="border-radius:16px;padding:20px;font-size:32px;font-weight:900;color:#fff;text-align:center;cursor:pointer;display:block;">
          影收貨單相片
        </label>
        <input type="file" id="grnFileInput" accept="image/*" capture="environment" style="display:none;" onchange="onPhotoSelected(event)" />
      </div>

      <div class="photo-preview">
        <img id="grnPreviewImg" alt="收貨單相片" />
      </div>

      <div class="btn-row" style="margin-top:18px;">
        <button type="button" class="btn-gray" onclick="goStep(1)">上一步</button>
        <button type="button" class="btn-green" onclick="saveRecord()">儲存此單</button>
      </div>
    </section>

    <!-- 第三步：匯出所有完成紀錄 -->
    <section id="step3" class="card hidden">
      <div class="label">已完成紀錄</div>

      <div class="btn-row">
        <button type="button" class="btn-green" onclick="exportCsv()">匯出 CSV 檔</button>
        <button type="button" class="btn-blue" onclick="exportAllPhotos()">下載全部相片</button>
      </div>

      <div class="btn-row single" style="margin-top:12px;">
        <button type="button" class="btn-red" onclick="clearAllRecords()">清空全部紀錄</button>
      </div>

      <div id="recordsList" style="margin-top:20px;"></div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "runner_cabinet_grn_v1";
    let records = [];
    let currentPhotoData = "";
    let scanning = false;
    let stream = null;
    let scanTimer = null;

    function init() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) records = JSON.parse(raw);
      } catch (e) {
        records = [];
      }
      renderBadge();
      renderRecords();
      makePng();
    }

    function showMsg(text) {
      const el = document.getElementById("statusBanner");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(window._msgTimer);
      window._msgTimer = setTimeout(() => el.classList.remove("show"), 3000);
    }

    function goStep(step) {
      stopScanner();
      [1, 2, 3].forEach((n) => {
        document.getElementById("step" + n).classList.toggle("hidden", n !== step);
        const tab = document.getElementById("tab" + n);
        tab.classList.toggle("active", n === step);
      });
      if (step === 2) {
        const code = document.getElementById("barcodeInput").value.trim() || "未填";
        document.getElementById("activeCodeLabel").textContent = "目前條碼：" + code;
      }
      if (step === 3) {
        renderRecords();
      }
    }

    function onBarcodeInput() {
      makePng();
    }

    // 繪製高對比條碼及大字 PNG 方便其他裝置掃描或查看
    function makePng() {
      const code = (document.getElementById("barcodeInput").value || "174400108").trim();
      const canvas = document.getElementById("barcodeCanvas");
      const ctx = canvas.getContext("2d");

      canvas.width = 760;
      canvas.height = 300;

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#000000";
      ctx.font = "bold 34px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("自助櫃條碼：" + code, canvas.width / 2, 46);

      // 產生 Code39 風格黑白條碼線條
      const startX = 70;
      const barTop = 68;
      const barHeight = 150;
      const totalWidth = canvas.width - 140;
      let cursor = startX;

      let seed = 0;
      for (let i = 0; i < code.length; i++) {
        seed = (seed * 31 + code.charCodeAt(i)) % 100000;
      }

      const patternCount = 58;
      const unit = totalWidth / (patternCount * 2.2);

      for (let i = 0; i < patternCount; i++) {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        const thick = (seed % 3 === 0) ? 2.4 : 1.2;
        const w = thick * unit;
        if (i % 2 === 0 || i === 0 || i === patternCount - 1) {
          ctx.fillRect(cursor, barTop, Math.max(2, w), barHeight);
        }
        cursor += w + unit * 0.9;
      }

      ctx.font = "bold 42px monospace";
      ctx.fillText(code, canvas.width / 2, 268);

      const dataUrl = canvas.toDataURL("image/png");
      document.getElementById("pngImg").src = dataUrl;
      return dataUrl;
    }

    async function shareOrDownloadPng() {
      const code = (document.getElementById("barcodeInput").value || "barcode").trim();
      const dataUrl = makePng();
      const res = await fetch(dataUrl);
      const blob = await res.blob();
      const file = new File([blob], code + ".png", { type: "image/png" });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: "條碼 " + code
          });
          showMsg("已開啟分享");
          return;
        } catch (err) {
          if (err.name === "AbortError") return;
        }
      }

      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = code + ".png";
      a.click();
      showMsg("已下載 PNG");
    }

    async function toggleScanner() {
      if (scanning) {
        stopScanner();
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showMsg("此機不支援相機，請直接輸入");
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        const video = document.getElementById("video");
        video.srcObject = stream;
        await video.play();
        document.getElementById("scannerBox").classList.add("open");
        document.getElementById("scanBtn").textContent = "停止掃碼";
        scanning = true;

        const hasDetector = ("BarcodeDetector" in window);
        const detector = hasDetector ? new window.BarcodeDetector() : null;

        scanTimer = setInterval(async () => {
          if (!scanning || video.readyState < 2) return;
          if (detector) {
            try {
              const codes = await detector.detect(video);
              if (codes && codes.length > 0 && codes[0].rawValue) {
                document.getElementById("barcodeInput").value = codes[0].rawValue.trim();
                makePng();
                stopScanner();
                showMsg("已掃到：" + codes[0].rawValue.trim());
              }
            } catch (e) {}
          }
        }, 350);

        if (!hasDetector) {
          showMsg("請對準條碼，或直接輸入號碼");
        }
      } catch (err) {
        showMsg("開唔到相機，請直接輸入");
      }
    }

    function stopScanner() {
      scanning = false;
      clearInterval(scanTimer);
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
      document.getElementById("scannerBox").classList.remove("open");
      document.getElementById("scanBtn").textContent = "開相機掃碼";
    }

    function onPhotoSelected(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const maxW = 1280;
          const scale = img.width > maxW ? maxW / img.width : 1;
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          const ctx = c.getContext("2d");
          ctx.drawImage(img, 0, 0, c.width, c.height);
          currentPhotoData = c.toDataURL("image/jpeg", 0.82);

          const preview = document.getElementById("grnPreviewImg");
          preview.src = currentPhotoData;
          preview.classList.add("show");
          showMsg("已影好相片");
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveRecord() {
      const code = document.getElementById("barcodeInput").value.trim();
      const grnNo = document.getElementById("grnNoInput").value.trim();

      if (!code) {
        showMsg("請先填條碼號碼");
        goStep(1);
        return;
      }
      if (!currentPhotoData) {
        showMsg("請先影收貨單相片");
        return;
      }

      const now = new Date();
      const timeStr = now.toLocaleString("zh-HK", { hour12: false });

      records.unshift({
        id: "R" + Date.now(),
        barcode: code,
        grnNo: grnNo,
        time: timeStr,
        photo: currentPhotoData
      });

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      } catch (e) {
        showMsg("儲存空間滿，請先匯出");
        return;
      }

      currentPhotoData = "";
      document.getElementById("barcodeInput").value = "";
      document.getElementById("grnNoInput").value = "";
      document.getElementById("grnFileInput").value = "";
      const preview = document.getElementById("grnPreviewImg");
      preview.src = "";
      preview.classList.remove("show");
      makePng();

      renderBadge();
      renderRecords();
      showMsg("已儲存：" + code);
      goStep(3);
    }

    function renderBadge() {
      document.getElementById("savedCountBadge").textContent = "已存：" + records.length + " 單";
    }

    function renderRecords() {
      const box = document.getElementById("recordsList");
      if (!records.length) {
        box.innerHTML = '<div class="record-sub">未有紀錄</div>';
        return;
      }

      box.innerHTML = records.map((r, idx) => `
        <div class="record-item">
          <div class="record-main">${idx + 1}. 條碼：${escapeHtml(r.barcode)}</div>
          <div class="record-sub">單號：${escapeHtml(r.grnNo || "無")} ｜ 時間：${escapeHtml(r.time)}</div>
          <div class="record-actions">
            <button type="button" class="btn-blue btn-small" onclick="downloadSinglePhoto('${r.id}')">下載相片</button>
            <button type="button" class="btn-red btn-small" onclick="deleteRecord('${r.id}')">刪除</button>
          </div>
        </div>
      `).join("");
    }

    function downloadSinglePhoto(id) {
      const r = records.find((x) => x.id === id);
      if (!r || !r.photo) return;
      const a = document.createElement("a");
      a.href = r.photo;
      a.download = (r.barcode || "grn") + "_" + (r.grnNo || "photo") + ".jpg";
      a.click();
    }

    function exportAllPhotos() {
      if (!records.length) {
        showMsg("未有相片可下載");
        return;
      }
      records.forEach((r, i) => {
        if (!r.photo) return;
        setTimeout(() => {
          const a = document.createElement("a");
          a.href = r.photo;
          a.download = `${i + 1}_${r.barcode}_${r.grnNo || "grn"}.jpg`;
          a.click();
        }, i * 250);
      });
      showMsg("開始下載 " + records.length + " 張相片");
    }

    function exportCsv() {
      if (!records.length) {
        showMsg("未有紀錄可匯出");
        return;
      }
      const header = ["序號", "條碼號碼", "收貨單號", "時間", "相片檔名"];
      const rows = records.map((r, i) => [
        i + 1,
        r.barcode,
        r.grnNo || "",
        r.time,
        `${i + 1}_${r.barcode}_${r.grnNo || "grn"}.jpg`
      ]);
      const csvContent = "﻿" + [header, ...rows]
        .map((row) => row.map((cell) => '"' + String(cell).replace(/"/g, '""') + '"').join(","))
        .join("
");

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "收貨紀錄_" + new Date().toISOString().slice(0, 10) + ".csv";
      a.click();
      URL.revokeObjectURL(url);
      showMsg("已匯出 CSV 檔");
    }

    function deleteRecord(id) {
      records = records.filter((r) => r.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      renderBadge();
      renderRecords();
      showMsg("已刪除");
    }

    function clearAllRecords() {
      if (!records.length) return;
      if (!confirm("確定清空全部紀錄？")) return;
      records = [];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      renderBadge();
      renderRecords();
      showMsg("已清空");
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[m]));
    }

    init();
  </script>
</body>
</html>
