<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRN Scanner & OCR Export</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f1f5f9; color: #0f172a; padding: 16px; }
    .app { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .bar { background: #0f172a; color: #fff; padding: 12px 16px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .bar h1 { font-size: 15px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button { cursor: pointer; border: none; border-radius: 7px; padding: 8px 12px; font-size: 12px; font-weight: 600; }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-green { background: #10b981; color: #052e16; }
    .btn-light { background: #e2e8f0; color: #0f172a; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .preview-box { background: #0f172a; border-radius: 8px; height: 260px; display: flex; align-items: center; justify-content: center; overflow: hidden; color: #94a3b8; font-size: 12px; }
    .preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 4px; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #94a3b8; border-radius: 7px; font-family: monospace; font-size: 13px; }
    .door-box { background: #fef08a; border-color: #eab308; font-weight: 800; text-align: center; font-size: 16px; }
    .status { font-size: 12px; color: #334155; background: #f8fafc; border: 1px solid #e2e8f0; padding: 7px 10px; border-radius: 7px; }
    .table-wrap { background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 9px 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; font-weight: 700; color: #334155; }
    tr.active { background: #eff6ff; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <input type="file" id="photoInput" accept="image/*" multiple class="hidden" />
  <div class="app">
    <div class="bar">
      <h1>GRN Photo Scanner & OCR</h1>
      <div class="actions">
        <button id="btnAddPhoto" class="btn-blue">+ Insert Photo</button>
        <button id="btnExportXlsx" class="btn-green">Export Excel (.xlsx)</button>
        <button id="btnExportCsv" class="btn-light">Export CSV</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="preview-box" id="previewBox">No photo inserted</div>
        <div class="actions">
          <button id="btnScanNow" class="btn-blue">Scan Photo (Barcode + OCR)</button>
          <button id="btnPrev" class="btn-light">Prev</button>
          <button id="btnNext" class="btn-light">Next</button>
          <span id="photoCounter" style="margin-left:auto; font-size:12px; color:#64748b;">0 / 0</span>
        </div>
        <div class="status" id="statusMsg">Insert a photo to start.</div>
      </div>

      <div class="card">
        <div class="row-2">
          <div>
            <label for="pwInput">1. Password (Scanner / OCR)</label>
            <input id="pwInput" type="text" placeholder="e.g. 174466168" />
          </div>
          <div>
            <label for="doorInput">Door # (Auto Last 2 Digits)</label>
            <input id="doorInput" type="text" class="door-box" placeholder="--" />
          </div>
        </div>
        <div class="row-2">
          <div>
            <label for="poInput">2. PO Number (OCR)</label>
            <input id="poInput" type="text" placeholder="e.g. 3401245961" />
          </div>
          <div>
            <label for="reqInput">Requestor (OCR)</label>
            <input id="reqInput" type="text" placeholder="e.g. martin.tai" />
          </div>
        </div>
        <div class="actions">
          <button id="btnSaveNext" class="btn-green">Save & Next</button>
          <button id="btnDelete" class="btn-light">Delete Photo</button>
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Photo</th>
            <th>Password</th>
            <th>Door #</th>
            <th>PO Number</th>
            <th>Requestor</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:18px;">No records yet</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const state = { items: [], activeIndex: -1, worker: null };
    const el = {
      photoInput: document.getElementById('photoInput'),
      previewBox: document.getElementById('previewBox'),
      photoCounter: document.getElementById('photoCounter'),
      statusMsg: document.getElementById('statusMsg'),
      pwInput: document.getElementById('pwInput'),
      doorInput: document.getElementById('doorInput'),
      poInput: document.getElementById('poInput'),
      reqInput: document.getElementById('reqInput'),
      tableBody: document.getElementById('tableBody')
    };

    function current() { return state.items[state.activeIndex] || null; }

    function applyPassword(rawPw) {
      const item = current();
      if (!item) return;
      item.password = rawPw.trim();
      const digits = item.password.replace(/\D/g, '');
      item.door = digits.length >= 2 ? digits.slice(-2) : '';
      render();
    }

    async function scanBarcode(img) {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth || img.width;
      c.height = img.naturalHeight || img.height;
      c.getContext('2d').drawImage(img, 0, 0);

      if ('BarcodeDetector' in window) {
        try {
          const det = new BarcodeDetector({ formats: ['code_128', 'code_39', 'ean_13', 'ean_8', 'upc_a', 'qr_code'] });
          const res = await det.detect(c);
          if (res.length && res[0].rawValue) return res[0].rawValue.trim();
        } catch (e) {}
      }
      if (window.ZXingBrowser) {
        try {
          const reader = new ZXingBrowser.BrowserMultiFormatReader();
          const res = await reader.decodeFromImageElement(img);
          if (res && res.getText()) return res.getText().trim();
        } catch (e) {}
      }
      return '';
    }

    function parseOcr(text, item) {
      const poMatch = text.match(/P\/O\s*no[:.\s]*([38][490][0O]\d{7})/i) || text.match(/\b([38][490][0O]\d{7})\b/);
      if (poMatch) item.po = poMatch[1].replace(/[Oo]/g, '0');

      const reqMatch = text.match(/Requestor[\s\S]{0,140}?\b([a-z]{2,16}\.[a-z]{1,15}|0\d{7})\b/i)
        || text.match(/\b([a-z]{2,15}\.[a-z]{1,15})\b/);
      if (reqMatch && !reqMatch[1].includes('com')) item.requester = reqMatch[1];

      if (!item.password) {
        const pwMatch = text.match(/(?:PW|Password|PIN)[:\s#]*([0-9A-Za-z-]{4,16})/i);
        if (pwMatch) {
          item.password = pwMatch[1].trim();
          const digits = item.password.replace(/\D/g, '');
          item.door = digits.length >= 2 ? digits.slice(-2) : '';
        }
      }
    }

    async function scanCurrent() {
      const item = current();
      if (!item) return;
      el.statusMsg.textContent = 'Scanning photo...';

      const bc = await scanBarcode(item.img);
      if (bc) {
        item.password = bc;
        const digits = bc.replace(/\D/g, '');
        item.door = digits.length >= 2 ? digits.slice(-2) : '';
      }

      if (typeof Tesseract !== 'undefined') {
        if (!state.worker) state.worker = await Tesseract.createWorker('eng');
        const out = await state.worker.recognize(item.img);
        parseOcr(out.data.text || '', item);
      }

      el.statusMsg.textContent = `Done: PW=${item.password || '—'}, Door=${item.door || '—'}, PO=${item.po || '—'}, Req=${item.requester || '—'}`;
      render();
    }

    function addFiles(files) {
      const valid = Array.from(files).filter(f => f.type.startsWith('image/'));
      if (!valid.length) return;
      let count = 0;
      valid.forEach(file => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = async () => {
            state.items.push({ name: file.name, url: e.target.result, img, password: '', door: '', po: '', requester: '' });
            if (state.activeIndex === -1) state.activeIndex = 0;
            count++;
            render();
            if (count === valid.length) {
              for (let i = 0; i < state.items.length; i++) {
                state.activeIndex = i;
                render();
                await scanCurrent();
              }
              state.activeIndex = 0;
              render();
            }
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function render() {
      const item = current();
      el.photoCounter.textContent = `${state.items.length ? state.activeIndex + 1 : 0} / ${state.items.length}`;
      if (!item) {
        el.previewBox.innerHTML = 'No photo inserted';
        el.pwInput.value = el.doorInput.value = el.poInput.value = el.reqInput.value = '';
      } else {
        el.previewBox.innerHTML = `<img src="${item.url}" alt="${item.name}" />`;
        el.pwInput.value = item.password;
        el.doorInput.value = item.door;
        el.poInput.value = item.po;
        el.reqInput.value = item.requester;
      }

      if (!state.items.length) {
        el.tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:18px;">No records yet</td></tr>';
        return;
      }

      el.tableBody.innerHTML = state.items.map((r, i) => `
        <tr class="${i === state.activeIndex ? 'active' : ''}" onclick="selectRow(${i})">
          <td>${i + 1}</td>
          <td>${r.name}</td>
          <td><b>${r.password || '—'}</b></td>
          <td><b>${r.door || '—'}</b></td>
          <td>${r.po || '—'}</td>
          <td>${r.requester || '—'}</td>
        </tr>
      `).join('');
    }

    window.selectRow = i => { state.activeIndex = i; render(); };

    function exportRows() {
      return state.items.map((r, i) => ({
        No: i + 1,
        Photo: r.name,
        Password: r.password,
        'Door #': r.door,
        'PO Number': r.po,
        Requestor: r.requester
      }));
    }

    function exportXlsx() {
      if (!state.items.length) return;
      const ws = XLSX.utils.json_to_sheet(exportRows());
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'GRN');
      XLSX.writeFile(wb, `GRN_${new Date().toISOString().slice(0, 10)}.xlsx`);
    }

    function exportCsv() {
      if (!state.items.length) return;
      const rows = exportRows();
      const keys = Object.keys(rows[0]);
      const csv = '\uFEFF' + [keys.join(','), ...rows.map(r => keys.map(k => `"${String(r[k] ?? '').replace(/"/g, '""')}"`).join(','))].join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      a.download = `GRN_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
    }

    document.getElementById('btnAddPhoto').onclick = () => el.photoInput.click();
    el.photoInput.onchange = e => { addFiles(e.target.files); e.target.value = ''; };
    document.getElementById('btnScanNow').onclick = scanCurrent;
    document.getElementById('btnPrev').onclick = () => { if (state.activeIndex > 0) { state.activeIndex--; render(); } };
    document.getElementById('btnNext').onclick = () => { if (state.activeIndex < state.items.length - 1) { state.activeIndex++; render(); } };
    document.getElementById('btnSaveNext').onclick = () => {
      if (state.activeIndex < state.items.length - 1) state.activeIndex++;
      render();
    };
    document.getElementById('btnDelete').onclick = () => {
      if (!current()) return;
      state.items.splice(state.activeIndex, 1);
      state.activeIndex = Math.min(state.activeIndex, state.items.length - 1);
      render();
    };
    el.pwInput.oninput = e => applyPassword(e.target.value);
    el.doorInput.oninput = e => { if (current()) { current().door = e.target.value.trim(); render(); } };
    el.poInput.oninput = e => { if (current()) { current().po = e.target.value.trim(); render(); } };
    el.reqInput.oninput = e => { if (current()) { current().requester = e.target.value.trim(); render(); } };
    document.getElementById('btnExportXlsx').onclick = exportXlsx;
    document.getElementById('btnExportCsv').onclick = exportCsv;
  </script>
</body>
</html>
