<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin 還原相片與快速 Mapping</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-light: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --border: #475569;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 16px; }

    .wrap { max-width: 1100px; margin: 0 auto; }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-bottom: 16px;
    }
    .top-bar h1 { margin: 0; font-size: 1.3rem; }

    .btn {
      padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card-light); color: #fff; font-weight: 700; font-size: 0.98rem; cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #082f49; border: none; font-weight: 800; }
    .btn-green { background: var(--green); color: #052e16; border: none; font-weight: 800; }

    .grid-main { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; }
    @media (max-width: 820px) { .grid-main { grid-template-columns: 1fr; } }

    .box {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px;
    }

    .photo-stage {
      background: #000; border: 1px solid var(--border); border-radius: 12px;
      min-height: 360px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 8px;
    }
    .photo-stage img {
      max-width: 100%; max-height: 460px; object-fit: contain; transition: transform 0.2s ease;
    }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; justify-content: space-between; }
    .nav-group { display: flex; gap: 8px; }

    label { display: block; font-size: 0.92rem; font-weight: 700; margin-bottom: 5px; color: #e2e8f0; }
    input[type="text"], select {
      width: 100%; padding: 10px 12px; font-size: 1rem; border-radius: 8px;
      border: 1px solid var(--border); background: #0f172a; color: #fff; margin-bottom: 10px;
    }

    .table-wrap { overflow-x: auto; margin-top: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    th { background: var(--card-light); }
    tr.active-row { background: rgba(56, 189, 248, 0.14); }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <h1>🖥️ Admin 睇相與 Mapping 工作台</h1>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <label class="btn btn-primary" for="json-file-input" style="margin:0;">📂 匯入 Runner JSON 檔</label>
      <input type="file" id="json-file-input" accept=".json,application/json" hidden />
      <button class="btn btn-green" type="button" onclick="exportMappedCsv()">📊 匯出 Mapping CSV</button>
    </div>
  </div>

  <div class="grid-main">
    <!-- 左邊：還原出嚟嘅相片 -->
    <div class="box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <strong id="item-counter">未匯入相片（0 / 0）</strong>
        <span id="item-time" style="color:var(--muted); font-size:0.92rem;">—</span>
      </div>

      <div class="photo-stage">
        <img id="stage-img" alt="還原相片" style="display:none;" />
        <span id="stage-empty" style="color:var(--muted);">請按上方「匯入 Runner JSON 檔」載入相片</span>
      </div>

      <div class="toolbar">
        <div class="nav-group">
          <button class="btn" type="button" onclick="prevItem()">⬅️ 上一張</button>
          <button class="btn" type="button" onclick="nextItem()">下一張 ➡️</button>
        </div>
        <div class="nav-group">
          <button class="btn" type="button" onclick="rotateStage(-90)">↺ 左轉 90°</button>
          <button class="btn" type="button" onclick="rotateStage(90)">↻ 右轉 90°</button>
        </div>
      </div>
    </div>

    <!-- 右邊：快速填寫 / 對數 -->
    <div class="box">
      <h2 style="margin:0 0 12px; font-size:1.15rem;">✏️ 核對 / 填寫資料</h2>

      <label for="m-door">門號（1–96）</label>
      <select id="m-door" onchange="updateCurrentField('door', parseInt(this.value, 10))"></select>

      <label for="m-barcode">熱感紙 Barcode</label>
      <input type="text" id="m-barcode" placeholder="輸入或貼上條碼" oninput="updateCurrentField('barcode', this.value)" />

      <label for="m-po">PO Number</label>
      <input type="text" id="m-po" placeholder="例如: 3401231649" oninput="updateCurrentField('po', this.value)" />

      <label for="m-grn">Goods Receipt No.</label>
      <input type="text" id="m-grn" placeholder="例如: 5004562328" oninput="updateCurrentField('grn', this.value)" />

      <label for="m-dept">Department Name</label>
      <input type="text" id="m-dept" placeholder="例如: Okura F&B Admin BO" oninput="updateCurrentField('dept', this.value)" />

      <label for="m-req">Requestor</label>
      <input type="text" id="m-req" placeholder="例如: risa akiyama" oninput="updateCurrentField('requestor', this.value)" />

      <button class="btn btn-green" style="width:100%; padding:13px;" type="button" onclick="nextItem()">✅ 填好呢張，去下一張 ➡️</button>
    </div>
  </div>

  <!-- 底部總表 -->
  <div class="box table-wrap">
    <h2 style="margin:0 0 10px; font-size:1.15rem;">📋 已載入清單總覽</h2>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>影相時間</th>
          <th>門號</th>
          <th>Barcode</th>
          <th>PO</th>
          <th>GRN</th>
          <th>Department</th>
          <th>Requestor</th>
        </tr>
      </thead>
      <tbody id="summary-tbody"></tbody>
    </table>
  </div>
</div>

<script>
  let items = [];
  let currentIndex = 0;
  let currentRot = 0;

  function initDoorSelect() {
    const sel = document.getElementById('m-door');
    sel.innerHTML = '';
    for (let d = 1; d <= 96; d++) {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = `Door #${String(d).padStart(2, '0')}`;
      sel.appendChild(opt);
    }
  }

  document.getElementById('json-file-input').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!Array.isArray(parsed) || !parsed.length) {
        return alert('呢個 JSON 檔入面冇相片紀錄。');
      }
      items = parsed.map((raw, idx) => ({
        seq: idx + 1,
        timeLabel: raw.timeLabel || raw.timeIso || '',
        timeIso: raw.timeIso || raw.time || '',
        photo: raw.photo || '',
        door: raw.door || 1,
        barcode: raw.barcode || '',
        po: raw.po || '',
        grn: raw.grn || '',
        dept: raw.dept || '',
        requestor: raw.requestor || ''
      }));
      currentIndex = 0;
      currentRot = 0;
      renderCurrent();
      renderTable();
    } catch (_) {
      alert('無法讀取呢個 JSON 檔，請確認係由 Runner 匯出嘅 .json。');
    }
  });

  function renderCurrent() {
    const img = document.getElementById('stage-img');
    const empty = document.getElementById('stage-empty');
    if (!items.length) {
      img.style.display = 'none';
      empty.style.display = 'inline';
      document.getElementById('item-counter').textContent = '未匯入相片（0 / 0）';
      document.getElementById('item-time').textContent = '—';
      return;
    }

    const it = items[currentIndex];
    document.getElementById('item-counter').textContent = `第 ${currentIndex + 1} / ${items.length} 張（#${it.seq}）`;
    document.getElementById('item-time').textContent = it.timeLabel || '—';

    if (it.photo) {
      img.src = it.photo;
      img.style.display = 'block';
      img.style.transform = `rotate(${currentRot}deg)`;
      empty.style.display = 'none';
    } else {
      img.style.display = 'none';
      empty.style.display = 'inline';
      empty.textContent = '此紀錄冇相片資料';
    }

    document.getElementById('m-door').value = it.door || 1;
    document.getElementById('m-barcode').value = it.barcode || '';
    document.getElementById('m-po').value = it.po || '';
    document.getElementById('m-grn').value = it.grn || '';
    document.getElementById('m-dept').value = it.dept || '';
    document.getElementById('m-req').value = it.requestor || '';
  }

  function updateCurrentField(key, val) {
    if (!items.length) return;
    items[currentIndex][key] = val;
    renderTable();
  }

  function rotateStage(deg) {
    currentRot = (currentRot + deg + 360) % 360;
    const img = document.getElementById('stage-img');
    if (img.style.display !== 'none') {
      img.style.transform = `rotate(${currentRot}deg)`;
    }
  }

  function prevItem() {
    if (!items.length) return;
    currentIndex = (currentIndex - 1 + items.length) % items.length;
    currentRot = 0;
    renderCurrent();
    renderTable();
  }

  function nextItem() {
    if (!items.length) return;
    currentIndex = (currentIndex + 1) % items.length;
    currentRot = 0;
    renderCurrent();
    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('summary-tbody');
    tbody.innerHTML = '';
    items.forEach((it, idx) => {
      const tr = document.createElement('tr');
      if (idx === currentIndex) tr.className = 'active-row';
      tr.style.cursor = 'pointer';
      tr.onclick = () => {
        currentIndex = idx;
        currentRot = 0;
        renderCurrent();
        renderTable();
      };
      tr.innerHTML = `
        <td>${it.seq}</td>
        <td>${it.timeLabel || '—'}</td>
        <td>Door #${String(it.door || 1).padStart(2, '0')}</td>
        <td>${it.barcode || '—'}</td>
        <td>${it.po || '—'}</td>
        <td>${it.grn || '—'}</td>
        <td>${it.dept || '—'}</td>
        <td>${it.requestor || '—'}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function exportMappedCsv() {
    if (!items.length) return alert('未有資料可以匯出。');
    const headers = ['Seq', 'Time', 'Door', 'Barcode', 'PO', 'GRN', 'Department', 'Requestor'];
    const rows = items.map(it => [
      it.seq, it.timeLabel || '', it.door || '', it.barcode || '', it.po || '', it.grn || '', it.dept || '', it.requestor || ''
    ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
    const csv = '\uFEFF' + [headers.join(','), ...rows].join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    a.download = `Admin_Mapped_Cabinet_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
  }

  initDoorSelect();
</script>
</body>
</html>
